<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Demma Guciàn</title>
<style>
@font-face { font-family: "Arimo"; src: local("Arimo"), url("fonts/Arimo.ttf") format("truetype"); font-weight: 400 700; font-style: normal; font-display: swap; }
:root {
  color-scheme: dark;
  --ink: #fff;
  --ink-rgb: 255,255,255;
  --m: clamp(12px, 2vw, 24px);
  --site-type: clamp(.88rem, 1.76vw, 1.056rem);
  --row-h: 21.12px;
  --edge-b: calc(var(--m) + env(safe-area-inset-top, 0px) / 2);
  --header-h: calc(env(safe-area-inset-top, 0px) + var(--m) + var(--row-h) + var(--m));
  --footer-h: var(--header-h);
  --ico-stroke: 1.84;
  --ico-op: .9;
  --txt-glow: none;
  --txt-glow-sel: none;
  --ico-glow: none;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; background: #000; color: var(--ink); font-family: "Helvetica Neue", Helvetica, "Arimo", Arial, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.stage { position: fixed; z-index: 1; inset: 0; overflow: hidden; background: #000; transition: opacity .9s ease; }
.home-background { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; pointer-events: none; }
.stage.section-mode { opacity: 0; pointer-events: none; }
.site-header { position: fixed; z-index: 10; top: 0; left: 0; right: 0; height: var(--header-h); display: flex; align-items: center; padding: 0 var(--m); background: transparent; }
.site-name { position: relative; display: inline-block; height: var(--row-h); line-height: var(--row-h); color: var(--ink); text-shadow: var(--txt-glow); text-decoration: none; font-size: var(--site-type); letter-spacing: -.025em; font-weight: 500; white-space: nowrap; }
.site-name .nl { display: inline-block; white-space: pre; height: var(--row-h); line-height: var(--row-h); }
.site-name .nr { display: inline-block; vertical-align: top; height: var(--row-h); line-height: var(--row-h); width: 0; opacity: 0; white-space: pre; clip-path: inset(-30px 0 -30px 0); will-change: width, opacity; }
.menu { position: relative; margin-left: auto; display: flex; align-items: center; height: var(--row-h); }
.main-nav { display: flex; align-items: center; gap: .5em; text-transform: lowercase; visibility: hidden; height: var(--row-h); }
.menu-btn { --plus: calc(var(--site-type) * 1.125); font-size: var(--site-type); flex: none; position: relative; width: var(--row-h); height: var(--row-h); margin-right: .5em; padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; will-change: transform; transform-origin: 50% 50%; filter: var(--ico-glow); }
.menu-btn .flip { display: block; width: var(--plus); height: var(--plus); will-change: transform; transform-origin: 50% 50%; }
.menu-btn .pulse { display: block; width: var(--plus); height: var(--plus); will-change: transform, opacity; }
.menu-btn svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; overflow: visible; transition: opacity .45s ease; }
.main-nav.vertical { position: absolute; top: calc(100% + 8px); right: 0; height: auto; flex-direction: column; align-items: flex-end; gap: 9px; }
.menu-btn:focus-visible, .theme-btn:focus-visible, .site-header a:focus-visible, .site-footer a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
.main-nav a { position: relative; display: inline-block; height: var(--row-h); line-height: var(--row-h); color: var(--ink); text-shadow: var(--txt-glow); text-decoration: none; font-size: var(--site-type); letter-spacing: -.025em; font-weight: 500; white-space: nowrap; transition: opacity .7s cubic-bezier(.22,.61,.36,1); }
.main-nav.has-selection a:not([aria-current="page"]) { opacity: .75; }
.main-nav a[aria-current="page"] { text-shadow: var(--txt-glow-sel); }
.main-nav a .t { display: inline-block; transform-origin: 50% 75%; transform: skewX(0deg); will-change: transform; -webkit-text-stroke: 0 currentColor; transition: transform .7s cubic-bezier(.22,.61,.36,1), -webkit-text-stroke-width .7s cubic-bezier(.22,.61,.36,1); }
.main-nav a[aria-current="page"] .t { transform: skewX(-12deg); -webkit-text-stroke-width: .3825px; }
.site-footer { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; height: var(--header-h); display: flex; align-items: flex-end; justify-content: space-between; padding: 0 var(--m) var(--edge-b); background: transparent; }
.social-stack { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.social-links { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.social-links > div, .theme-row { position: relative; display: flex; align-items: center; gap: 3px; height: 14px; }
.social-links a, .theme-btn { display: inline-flex; width: 14px; height: 14px; align-items: center; justify-content: center; color: var(--ink); text-decoration: none; filter: var(--ico-glow); }
.social-links a:hover { opacity: .55; }
.theme-btn { padding: 0; border: 0; background: none; font: inherit; cursor: pointer; }
.theme-row { justify-content: center; height: 14px; }
.theme-btn svg, .social-links svg { width: 12px; height: 12px; display: block; fill: none; stroke: currentColor; stroke-width: var(--ico-stroke); stroke-linecap: round; stroke-linejoin: round; opacity: var(--ico-op); }
.social-links .x-mark { width: 10px; height: 10px; fill: currentColor; stroke: none; }
.content-frame { position: fixed; z-index: 2; top: var(--header-h); left: 0; right: 0; bottom: var(--footer-h); display: none; overflow: hidden; background: transparent; }
.content-frame.open { display: block; animation: sectionIn .8s ease both; }
@keyframes sectionIn { from { opacity: 0; } to { opacity: 1; } }
.content-frame iframe { width: 100%; height: 100%; border: 0; display: none; background: transparent; }
.section-placeholder { display: none; min-height: 100%; }
@media (max-width: 700px) { :root { --m: 12px; --site-type: .88rem; } .main-nav { gap: .4em; } .menu-btn { margin-right: .4em; } .social-links { gap: 7px; } }
@media (min-width: 701px) { .social-links { gap: 12px; } .social-links > div { gap: 3.6px; height: 16.8px; } .social-links a, .theme-btn, .theme-row { width: 16.8px; height: 16.8px; } .theme-btn svg, .social-links svg { width: 14.4px; height: 14.4px; } .social-links .x-mark { width: 12px; height: 12px; } }
@media (prefers-reduced-motion: reduce) { .menu-btn, .social-links a { transition: none; } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 1.2s; animation-timing-function: cubic-bezier(.45,0,.2,1); }
html.theme-fade, html.theme-fade body, html.theme-fade .stage, html.theme-fade .site-header *, html.theme-fade .site-footer * { transition: background-color 1.2s ease, color 1.2s ease, opacity 1.2s ease, text-shadow 1.2s ease !important; }
html[data-theme="light"] { color-scheme: light; --ink: #2b2620; --ink-rgb: 43,38,32; --txt-glow: 0 .5px 1px rgba(35,29,23,.08), 0 1px 3.5px rgba(35,29,23,.05); --txt-glow-sel: 0 .5px 1px rgba(35,29,23,.085), 0 1px 3px rgba(35,29,23,.05); --ico-glow: drop-shadow(0 .5px 1px rgba(35,29,23,.10)) drop-shadow(0 1px 2.5px rgba(35,29,23,.06)); }
html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] .stage { background: #e4dfd8; }
html[data-theme="light"] .home-background { background: #e4dfd8; }
</style>
</head>
<body>
<div class="stage" id="home"><img id="homeBackground" class="home-background" alt="" aria-hidden="true"></div>
<header class="site-header">
  <a class="site-name" href="#home" id="homeLink" aria-label="Demma Guciàn"><span class="nl">D<span class="nr">emma&nbsp;</span></span><span class="nl">G<span class="nr">uciàn</span></span></a>
  <div class="menu" id="menu">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mainNav"><span class="flip"><span class="pulse"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="v" d="M12 1v22"/><path class="h" d="M1 12h22"/></svg></span></span></button>
    <nav class="main-nav" id="mainNav" aria-label="Main navigation">
      <a href="#portraits" id="portraitsLink"><span class="t">Artworks</span></a><a href="#writing" id="writingLink"><span class="t">Writing</span></a><a href="#process" id="processLink"><span class="t">Studio</span></a><a href="#me" id="meLink"><span class="t">Me</span></a>
    </nav>
  </div>
</header>
<main class="content-frame" id="contentFrame" aria-label="Selected section">
  <iframe id="externalPage" title="Demma Guciàn on Verse" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <section class="section-placeholder" id="writingPanel" hidden></section><section class="section-placeholder" id="processPanel" hidden></section><section class="section-placeholder" id="mePanel" hidden></section>
</main>
<footer class="site-footer">
  <div class="social-stack theme-stack"><div class="theme-row"><button type="button" class="theme-btn" id="themeBtn" aria-label="Switch to light mode" title="Switch to light mode"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button></div></div>
  <div class="social-stack"><div class="social-links" aria-label="Social links"><div>
    <a href="#" data-link="email" aria-label="Email" title="Email"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="1.5"/><path d="m3.5 6 8.5 7 8.5-7"/></svg></a>
    <a href="#" data-link="x" aria-label="X" title="X"><svg viewBox="0 0 24 24" aria-hidden="true" class="x-mark"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932zm-1.29 19.49h2.039L6.486 3.24H4.298z"/></svg></a>
    <a href="#" data-link="instagram" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.6" cy="6.6" r=".8" fill="currentColor" stroke="none"/></svg></a>
  </div></div></div>
</footer>
<script>
/* Site settings */
const CONFIG = {
  theme: 'auto',
  imageBase: '',
  folder: 'images/portrait-1',
  imageCount: 4
};
const ARTWORKS_URL = 'https://verse.works/demma-gucian';
const SITE_LINKS = { x: '', instagram: '', email: '' };

/* Pick a random available image; failed files fall through to the next candidate. */
function loadRandomBackground() {
  const image = document.getElementById('homeBackground');
  const total = Math.max(1, Math.min(100, Number(CONFIG.imageCount) || 1));
  const order = Array.from({ length: total }, (_, i) => i + 1);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  let index = 0;
  const base = CONFIG.imageBase + CONFIG.folder.replace(/\/$/, '') + '/';
  function tryNext() {
    if (index >= order.length) return;
    const file = String(order[index++]).padStart(3, '0') + '.jpg';
    const candidate = new Image();
    candidate.onload = () => { image.src = candidate.src; };
    candidate.onerror = tryNext;
    candidate.src = base + file;
  }
  tryNext();
}
loadRandomBackground();

/* Light / dark appearance */
const themeQuery = matchMedia('(prefers-color-scheme: light)');
let themePreference = new URLSearchParams(location.search).get('theme') || (() => {
  try { return localStorage.getItem('theme'); } catch (_) { return null; }
})() || CONFIG.theme;
let isLight = false;
const themeButton = document.getElementById('themeBtn');
function applyTheme() {
  isLight = themePreference === 'light' || (themePreference === 'auto' && themeQuery.matches);
  document.documentElement.dataset.theme = isLight ? 'light' : 'dark';
  const next = isLight ? 'dark' : 'light';
  themeButton.setAttribute('aria-label', `Switch to ${next} mode`);
  themeButton.title = `Switch to ${next} mode`;
}
function changeTheme() {
  themePreference = isLight ? 'dark' : 'light';
  try { localStorage.setItem('theme', themePreference); } catch (_) {}
  const update = applyTheme;
  if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(update);
  else {
    const root = document.documentElement;
    root.classList.add('theme-fade'); update();
    setTimeout(() => root.classList.remove('theme-fade'), 1400);
  }
}
applyTheme();
themeButton.addEventListener('click', changeTheme);
themeQuery.addEventListener('change', () => { if (themePreference === 'auto') applyTheme(); });

/* Sections and external artwork page */
const home = document.getElementById('home');
const contentFrame = document.getElementById('contentFrame');
const externalPage = document.getElementById('externalPage');
let artworksLoaded = false;
function showSection(section) {
  const active = Boolean(section);
  home.classList.toggle('section-mode', active);
  contentFrame.classList.toggle('open', active);
  externalPage.style.display = section === 'portraits' ? 'block' : 'none';
  if (section === 'portraits' && !artworksLoaded) {
    externalPage.src = ARTWORKS_URL;
    artworksLoaded = true;
  }
  document.getElementById('writingPanel').hidden = section !== 'writing';
  document.getElementById('processPanel').hidden = section !== 'process';
  document.getElementById('mePanel').hidden = section !== 'me';
  document.querySelectorAll('.main-nav a').forEach(link => {
    if (link.id === (section ? section + 'Link' : '')) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  document.getElementById('mainNav').classList.toggle('has-selection', active);
  if (!active && mTarget === 1) menuClose();
}
document.getElementById('homeLink').addEventListener('click', event => {
  event.preventDefault();
  if (mTarget === 1) closeMinus();
  else { showSection(null); nameCapTo(1, 500); }
});
for (const [id, section] of [['portraitsLink','portraits'],['writingLink','writing'],['processLink','process'],['meLink','me']]) {
  document.getElementById(id).addEventListener('click', event => { event.preventDefault(); showSection(section); });
}
document.querySelectorAll('.social-links a[data-link]').forEach(link => {
  const destination = SITE_LINKS[link.dataset.link];
  if (destination) link.href = destination;
  else { link.setAttribute('aria-disabled', 'true'); link.addEventListener('click', event => event.preventDefault()); }
});
document.addEventListener('keydown', event => { if (event.key === 'Escape') showSection(null); });

/* ===== Menu: a + that turns like a book page ===== */
/* Closed: the + sits at the right end and breathes. Opening: it travels straight to the left of the row while flipping like a page (the + is the front, the - is the back),
   the items appear in its wake, and it lands as a - . When - or DG is clicked, the minus turns closed into + directly (it never becomes a dot). */
const MENU = { flipMs: 650, autoCloseMs: 10000 };   // flipMs: the whole page turn. autoCloseMs: time of the half turn of the - before it closes
const menuBtn = document.getElementById('menuBtn'), navEl = document.getElementById('mainNav'), vBar = menuBtn.querySelector('.v');
const flipEl = menuBtn.querySelector('.flip'), pulseEl = menuBtn.querySelector('.pulse'), glyphEl = menuBtn.querySelector('svg');
const menuReduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let mP = 0, mTarget = 0, mDist = 1, mGap = 10, mAnim = 0, mTimer = 0;   // mP: progress 0 (closed) to 1 (open)
let mHome = false, mVertical = false;   // mHome: a section is selected
const mEase = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
/* The name rests as "DG": "emma " and "uciàn" open from the left to the right as the page turns, and close the same way on the way back */
const nameR = [...document.querySelectorAll('.site-name .nr')]; let nameW = [0, 0], nameE = 0;
function setNameOpen(e) {
  nameE = e;
  const total = (nameW[0] + nameW[1]) * e, w = [Math.min(nameW[0], total), Math.max(0, total - nameW[0])];
  nameR.forEach((el, i) => { el.style.width = w[i].toFixed(2) + 'px'; el.style.opacity = nameW[i] ? Math.min(1, w[i] / nameW[i] * 1.6).toFixed(3) : 0; });
}
function nameMeasure() {
  nameW = nameR.map(el => {
    const previous = el.style.width;
    el.style.width = 'auto';
    const width = el.getBoundingClientRect().width;
    el.style.width = previous;
    return width;
  });
  setNameOpen(nameCap);
}
let nameCap = 1, nameCapAnim = 0;   // nameCap: how open the name is allowed to be (1 = follows the menu, 0 = kept as DG)
function nameCapTo(target, ms) {
  cancelAnimationFrame(nameCapAnim);
    const from = nameCap, t0 = performance.now();
  if (menuReduce || !ms || from === target) { nameCap = target; setNameOpen(nameCap); return; }
  const tick = now => {
    const u = Math.min(1, (now - t0) / ms); nameCap = from + (target - from) * mEase(u);
    setNameOpen(nameCap);
    if (u < 1) nameCapAnim = requestAnimationFrame(tick);
  };
  nameCapAnim = requestAnimationFrame(tick);
}
function menuMeasure() {
  mGap = parseFloat(getComputedStyle(menuBtn).marginRight) || 0;
  nameMeasure();
  navEl.classList.remove('vertical');
  const navWidth = navEl.offsetWidth;
  const header = document.querySelector('.site-header');
  const rightPadding = parseFloat(getComputedStyle(header).paddingRight) || 0;
  const leftEdge = window.innerWidth - rightPadding - menuBtn.offsetWidth - mGap - navWidth;
  const siteName = document.querySelector('.site-name');
  const nameBox = siteName.getBoundingClientRect();
  const nameParts = [...siteName.querySelectorAll('.nl')];
  const hiddenParts = [...siteName.querySelectorAll('.nr')];
  const collapsedWidth = nameParts.reduce((sum, part, i) => sum + part.getBoundingClientRect().width - hiddenParts[i].getBoundingClientRect().width, 0);
  const nameRight = nameBox.left + collapsedWidth;
  mVertical = leftEdge < nameRight + 12;
  navEl.classList.toggle('vertical', mVertical);
  mDist = mVertical ? mGap : navWidth + mGap;
}
function menuDraw(p) {
  const e = mEase(p), pos = mVertical ? 0 : e * mDist, ang = 180 * e, flat = p <= 0 || p >= 1;
  setNameOpen(nameCap);
  menuBtn.style.transform = `translateX(${mDist - pos}px)`;
  flipEl.style.transform = flat ? 'none' : `perspective(260px) rotateY(${-ang}deg)`;
  /* on the back side the glyph is mirrored by the page turn; mirroring it back keeps the flip continuous (no jump at either end) */
  glyphEl.style.transform = !flat && ang >= 90 ? 'scaleX(-1)' : 'none';
  vBar.style.visibility = ang < 90 ? 'visible' : 'hidden';   // past the half turn the back side shows: a - sign
  if (mVertical) {                                           // the items unfold downwards from the - sign
    navEl.style.clipPath = `inset(-8px -8px calc(${((1 - e) * 100).toFixed(2)}% - 8px) -8px)`; navEl.style.opacity = e.toFixed(3);
  } else {
    navEl.style.clipPath = `inset(-8px -8px -8px ${Math.max(0, mDist - pos - mGap)}px)`;   // items show only to the right of the page
    navEl.style.opacity = '';
  }
}
/* The breathing of the + (closed) and of the - (open). It follows one clock through the page turn, so it never restarts from the beginning of its loop. */
let pulseT0 = 0;   // the breathing is at its brightest at this moment (it is moved to the end of the page turn when the - turns back into a +)
function pulseTick(now) {
  const f = (1 + Math.cos(2 * Math.PI * (now - pulseT0) / 3733)) / 2;           // 1 = brightest, 0 = dimmest
  const a = menuReduce ? 0 : 1;                                       // always pulsing: + closed, - open, and through the page turn
  const g = 1 - a * (1 - f);
  /* Wider breathing: the sign goes from a little darker (g = 0) to full brightness (g = 1), with a small size swing, and its glow follows. */
  pulseEl.style.opacity = (.56 + .44 * g).toFixed(3);
  pulseEl.style.transform = `scale(${(.98 + .05 * g).toFixed(3)})`;
  pulseEl.style.filter = `drop-shadow(0 0 ${(3 + 5 * g).toFixed(2)}px rgba(var(--ink-rgb), ${(.24 + .19 * g).toFixed(3)})) drop-shadow(0 0 ${(7 + 11 * g).toFixed(2)}px rgba(var(--ink-rgb), ${(.09 + .15 * g).toFixed(3)}))`;   // 50% of the previous glow
  if (!menuReduce) requestAnimationFrame(pulseTick);
}
function menuRun(target, done) {
  cancelAnimationFrame(mAnim); mTarget = target;
  const from = mP, total = MENU.flipMs * Math.abs(target - from), t0 = performance.now();
  if (target === 0) pulseT0 = t0 + total;   // closing: the + reaches full brightness exactly as the turn ends, and breathes down from there
  if (menuReduce || !total) { mP = target; menuDraw(mP); if (done) done(); return; }
  const tick = now => {
    const u = Math.min(1, (now - t0) / total); mP = from + (target - from) * u; menuDraw(mP);
    if (u < 1) mAnim = requestAnimationFrame(tick); else if (done) done();
  };
  mAnim = requestAnimationFrame(tick);
}
function menuCountStart() {                                // the - waits (still) for autoCloseMs, then the menu closes
  if (mHome || mTarget !== 1) return;
  clearTimeout(mTimer);
  mTimer = setTimeout(menuClose, MENU.autoCloseMs);
}
function menuOpen() {
  clearTimeout(mTimer);
  mHome = false;
  menuMeasure(); nameCapTo(0, 500);                       // hide the full name as + opens the menu
  navEl.style.visibility = 'visible'; menuBtn.setAttribute('aria-expanded', 'true');
  menuRun(1, menuCountStart);
}
function menuClose() {
  if (mTarget === 0) return;
  clearTimeout(mTimer);
  mHome = false;
 menuBtn.setAttribute('aria-label', 'Menu');
  nameCapTo(1, 500);                                      // restore the full Demma Guciàn wordmark as - is pressed
  menuBtn.setAttribute('aria-expanded', 'false');
  menuRun(0, () => {
    navEl.style.visibility = 'hidden';
    menuDraw(0);
  });
}
function closeMinus() {                                    // the - stays a - while the page turns closed into +
  if (mTarget !== 1) return;
  clearTimeout(mTimer);
  mHome = false;
  menuBtn.setAttribute('aria-label', 'Menu');
  showSection(null);                                       // clears the selected section and calls menuClose()
}
function menuToHome() {                                    // section selected: the minus stays visible, still, and the auto-close is cancelled
  if (mTarget !== 1) return;
  if (mHome) return;
  mHome = true; clearTimeout(mTimer);
  menuBtn.setAttribute('aria-label', 'Close section / return');
}
navEl.addEventListener('click', e => { if (e.target.closest('a')) menuToHome(); });
menuBtn.addEventListener('click', () => { if (mTarget === 1) closeMinus(); else menuOpen(); });
addEventListener('resize', () => { menuMeasure(); menuDraw(mP); });
menuMeasure(); nameCap = 1; setNameOpen(1); menuDraw(0); if (!menuReduce) requestAnimationFrame(pulseTick);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { menuMeasure(); menuDraw(mP); });

</script>
</body>
</html>
