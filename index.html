<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Demma Guciàn</title>
<style>
  :root { color-scheme: light; --ink: #111; --m: clamp(16px, 4vw, 56px); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; background: #fff; color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; touch-action: none; }
  canvas { display: block; height: auto; background: #fff; touch-action: none; outline: none; cursor: crosshair; will-change: transform;
    box-shadow: 0 12px 40px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.08); }

  .menu-btn { position: fixed; z-index: 3;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    width: 48px; height: 48px; border: 0; background: transparent; cursor: pointer;
    mix-blend-mode: difference; color: #fff; transition: transform .3s ease; }
  .menu-btn span { position: absolute; background: currentColor; }
  .menu-btn span:nth-child(1) { left: 12px; right: 12px; top: 23px; height: 2px; }
  .menu-btn span:nth-child(2) { top: 12px; bottom: 12px; left: 23px; width: 2px; }
  .menu-btn[aria-expanded="true"] { transform: rotate(45deg); }
  .menu-btn:focus-visible, nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .ctx { position: fixed; z-index: 4; min-width: 200px; padding: 6px; border-radius: 14px; background: rgba(255,255,255,.95);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 36px rgba(0,0,0,.28); }
  .ctx[hidden] { display: none; }
  .ctx button { display: block; width: 100%; padding: 14px 16px; border: 0; border-radius: 9px; background: none; color: #111;
    font: inherit; font-size: 1.05rem; text-align: left; cursor: pointer; }
  .ctx button:hover, .ctx button:active { background: rgba(0,0,0,.08); }

  .caption { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none;
    padding: 0 max(20px, env(safe-area-inset-left, 0px)) 0 max(20px, env(safe-area-inset-right, 0px));
    color: #fff; mix-blend-mode: difference; letter-spacing: .06em; font-variant-numeric: tabular-nums;
    z-index: 1; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    white-space: normal; text-wrap: balance; overflow-wrap: anywhere; line-height: 1.35;
    font-size: clamp(.75rem, .6rem + 1.2vw, 1.1rem); }
  .cap-num { display: inline-grid; }
  .cap-num span { grid-area: 1 / 1; }
  nav { position: fixed; z-index: 2; top: 0; right: 0; bottom: 0;
    width: min(320px, 85vw); padding: 96px 32px 32px; touch-action: pan-y;
    background: rgba(255,255,255,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transform: translateX(100%); visibility: hidden;
    transition: transform .35s ease, visibility 0s .35s; }
  nav.open { transform: none; visibility: visible; transition: transform .35s ease; }
  nav a { display: block; padding: 14px 0; color: var(--ink); text-decoration: none;
    font-size: 1.6rem; border-bottom: 1px solid rgba(0,0,0,.14); }
  nav a:hover { opacity: .65; }
  nav .drop { display: flex; width: 100%; justify-content: space-between; align-items: center;
    padding: 14px 0; background: none; border: 0; border-bottom: 1px solid rgba(0,0,0,.14);
    color: var(--ink); font: inherit; font-size: 1.6rem; text-align: left; cursor: pointer; }
  nav .drop:hover { opacity: .65; }
  .sublist { list-style: none; padding: 0; overflow: hidden; max-height: 0; visibility: hidden;
    transition: max-height .35s ease, visibility 0s .35s; }
  .sublist.open { max-height: 60dvh; overflow-y: auto; visibility: visible; transition: max-height .35s ease; }
  .sublist button { display: block; width: 100%; padding: 12px 0 12px 16px; background: none; border: 0;
    color: var(--ink); font: inherit; font-size: 1.05rem; line-height: 1.35; text-align: left;
    cursor: pointer; opacity: .65; }
  .sublist button:hover, .sublist button[aria-current="true"] { opacity: 1; }
  .sublist button:focus-visible, nav .drop:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { nav, .menu-btn, .sublist { transition: none; } }
</style>
</head>
<body>

<div class="stage"><canvas id="c"></canvas></div>
<div class="caption"><span id="capTitle"></span> <span class="cap-num"><span id="nA"></span><span id="nB"></span></span></div>

<div class="ctx" id="ctx" role="menu" hidden>
  <button id="shX" role="menuitem">Share on X</button>
</div>

  <span></span><span></span>
</button>
<nav id="menu" aria-label="Main">
  <button class="drop" id="portraitsBtn" aria-expanded="false" aria-controls="portraitList">Portraits <span aria-hidden="true">+</span></button>
  <ul class="sublist" id="portraitList"></ul>
  <a href="writing.html">Writing</a>
  <a href="about.html">About</a>
  <a href="mailto:you@example.com">Contact</a>
</nav>

<script>
/* ===== SETTINGS: edit this block only. ===== */
const CONFIG = {
  // Your portraits. Each one has a title and a folder holding images named 001.jpg, 002.jpg ... (lowercase .jpg).
  // To add a portrait, copy the whole { ... } block and add a comma between them.
  portraits: [
    { title: "Study for Self-Portrait with Tortoiseshell Glasses and Hawaiian Shirt, 2026",
      folder: "images/portrait-1",
      count: 4,       // how many images are uploaded right now. Raise it as you upload more (up to 100)
      url: "" }       // reserved for a marketplace link per image (not used yet)
  ],
  seed: null,           // null = a new random seed on every visit. A number (e.g. 12345) = the same random choices every time
  transitionMs: 4000,   // time for one full dissolve from one image to the next
  holdMs: 0,            // pause on each image between dissolves (0 = continuous)
  order: "sequence",    // "sequence" or "shuffle"
  imageBase: "",        // where your image folders live. "" = same site. With R2: "https://images.yourdomain.com/" (keep the final slash)
  imageCors: false,     // set true ONLY if images come from another address (R2) whose CORS settings allow your site; saving a piece needs it
  sizes: [],            // [] = one size, files directly in the portrait folder. Later: [1600, 3200], one subfolder per size
  caption: false,       // true = show the title and (#001) number at the bottom center
  style: "blend",       // "blend" = crossfade through a blend mode; "crossfade" = plain smooth blend
  blendMode: "multiply", // multiply, screen, overlay, soft-light, hard-light, difference, color-dodge, color-burn, luminosity
  blendAmount: 0.7,      // strength of the blend-mode look in the middle (0 = plain crossfade, 1 = full)
  ease: true,           // soft start and soft end of each transition
  hover: true,          // while the mouse or a finger is on the image, the transition parameters vary
  hoverModes: ["multiply", "screen", "overlay", "soft-light", "hard-light", "difference"],  // blend modes it may pick while hovering
  hoverAmount: [0.2, 1],       // range for the random blend strength
  hoverEveryMs: 900,           // while hovering, a new random strength is picked this often (ms)
  hoverGlide: 0.12,            // how quickly the strength follows each new value (0.06 = lazy, 0.18 = snappy)
  hoverFloor: 0.35,            // how much of the blend shows even at the start and end of a transition (0 = none, 1 = full)
  hoverFadeMs: 800,            // how long the hover effect takes to fade out after you leave
  hoverIdleMs: 1500,           // the mouse or finger counts as present until it has been still this long (ms)

  /* The hovered shape: under the pointer, an irregular area made of pixels with a similar color grows outward and shows the
     incoming image / blend. Its edges follow the pixels exactly. It keeps growing while you stay and starts over when you move to another color. */
  shapeTolerance: 40,   // how different a color can be and still be part of the shape (about 20 = strict, 80 = loose)
  shapeSpeed: 220,      // how fast it grows (cells of the shape grid per frame; 220 is about 13,000 per second). Lower = slower
  shapeNoise: 1.6,      // how irregular the growing edge is (0 = follows only the colors, 1.6 = flowing lobes; above about 3 it changes little)
  shapeFadeInMs: 700,   // how slowly the shape appears when you arrive (ms)
  shapeFadeOutMs: 2500, // how slowly it fades away after you leave (ms)
  shapeSwapMs: 900,     // when you move to another color, the old shape fades out and the new one in over this time (ms)
  shapeMaxArea: 0.3,    // the shape never covers more than this fraction of the image (0.3 = 30%)
  shapeMinCells: 500,   // if the area is smaller than this, the tolerance is loosened until there is a patch big enough
  shapeRes: 800,        // precision of the edges (long edge, in cells). Higher = finer edges but heavier

  /* How the image reacts to the mouse, a finger, a click or the wheel. All of it responds at once and fades out when you stop */
  react: {
    base: 0.6,        // effect level while the mouse or finger is simply on the image (0-1)
    motion: 0.8,      // extra level added by how fast the pointer moves (or the wheel turns)
    speedRef: 700,    // pointer speed (px/s) that counts as "full speed". Lower = reacts to gentler movement
    attackMs: 120,    // how fast the effect rises when you arrive (lower = snappier)
    pulseMs: 700,     // a touch or click gives a short burst that fades over this time (ms)
    boost: 2,         // while reacting, the dissolve runs faster: 2 = up to 3x faster at full effect (0 = same speed)
    skipHold: true,   // true = touching the image ends the pause between dissolves right away
    reveal: 1,        // strength of the hovered shape (0 = off, 1 = full)
    zoom: 0.035       // the image grows by this much while you press it and while the menu is open (0.035 = 3.5%, 0 = no zoom)
  },
  tapSlop: 10,          // px: moving more than this while pressed is a drag, not a click
  freezeMs: 10000,      // a frozen frame continues by itself after this many ms (the next click also continues it)
  focus: [0.5, 0.5]     // part of each image that stays in view when the window crops it (0-1, [0.5, 0.5] = center)
};

/* ===== RANDOMNESS ==================================================== */
/* A new random value is drawn for each parameter below at the start of every transition, so no two behave the same.
   The fixed values in CONFIG are just the starting point. All draws come from the seed, so they can be repeated.
   [min, max] = random number between the two   { pick: [...] } = one random choice   { pair: [min, max] } = a random low-high range
   To keep a parameter fixed, delete its line here. To stop all randomness: enabled: false. */
const RANDOM = {
  enabled: true,
  params: {
    transitionMs: [1500, 9000],
    holdMs: [0, 2500],
    order: { pick: ["sequence", "shuffle"] },
    style: { pick: ["blend", "crossfade"] },
    blendMode: { pick: ["multiply", "screen", "overlay", "soft-light", "hard-light", "difference", "color-dodge", "color-burn", "luminosity"] },
    blendAmount: [0.2, 1],
    ease: { pick: [true, false] },
    hoverAmount: { pair: [0.05, 1] },
    hoverEveryMs: [300, 2500],
    hoverGlide: [0.05, 0.2],
    hoverFloor: [0, 0.7],
    hoverFadeMs: [300, 2000],
    hoverIdleMs: [800, 3000],
    shapeTolerance: [20, 80]
  }
};
const ROLL = { transition: Object.keys(RANDOM.params) };
/* ===================================================================== */

/* Seeded random numbers: the same seed + transition number always gives the same draws */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash32 = (s, n) => (Math.imul(s ^ 0x9e3779b9, 0x85ebca6b) + Math.imul(n + 1, 0xc2b2ae35)) >>> 0;
let seed = CONFIG.seed != null ? CONFIG.seed >>> 0 : crypto.getRandomValues(new Uint32Array(1))[0];
let tn = 0, R = mulberry32(hash32(seed, 0));         // tn: transition counter; R: random source of the current transition
function roll(keys) {                                // draw new random values for these CONFIG parameters
  if (!RANDOM.enabled) return;
  keys.forEach(k => {
    const sp = RANDOM.params[k]; if (!sp) return;
    const num = (a, b) => { const v = a + R() * (b - a); return b > 10 ? Math.round(v) : v; };
    if (Array.isArray(sp)) CONFIG[k] = num(sp[0], sp[1]);
    else if (sp.pick) CONFIG[k] = sp.pick[Math.floor(R() * sp.pick.length)];
    else if (sp.pair) { const a = num(sp.pair[0], sp.pair[1]), b = num(sp.pair[0], sp.pair[1]); CONFIG[k] = [Math.min(a, b), Math.max(a, b)]; }
  });
}

/* Builds each portrait's image list: folder/001.jpg ... */
CONFIG.portraits.forEach(p => {
  if (p.images) return;
  p.images = Array.from({ length: p.count || 100 }, (_, i) => ({
    dir: CONFIG.imageBase + p.folder, file: `${String(i + 1).padStart(3, '0')}.jpg` }));
});

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let cur = 0, epoch = 0;                              // active portrait, switch counter
const imgs = () => CONFIG.portraits[cur].images;
const count = () => imgs().length || 6;
let W, H, C;
let curMode = CONFIG.blendMode, curMs = CONFIG.transitionMs;           // mode and duration of the current transition
const live = { amount: CONFIG.blendAmount, target: CONFIG.blendAmount };  // blend strength: moves smoothly toward its target
const mouse = { last: -1e9, roll: 0 };                                  // when the mouse or finger was last moving on the image
let energy = 0, effE = 0, lastQ = 0, lastNow = performance.now();      // energy: hover presence 0-1; effE: total effect level; lastQ: loop position 0 (A) to 1 (B)
let imgA, imgB, A, B, idxA = -1, idxB = -1, phase = 'loading', t0 = 0, prog = 0, queue = [];
const cache = new Map();

/* The canvas always takes the proportions of the image and fits inside the window with a margin */
let aspect = 3 / 4;
function setBox() {
  cv.style.aspectRatio = aspect;
  cv.style.width = `min(calc(100vw - 2 * var(--m)), calc((100dvh - 2 * var(--m)) * ${aspect}))`;
}
function applyAspect(im) {
  const a = (im.naturalWidth || im.width) / (im.naturalHeight || im.height);
  if (Math.abs(a - aspect) < .005) return false;
  aspect = a; setBox(); return true;
}

/* Caption */
const capTitle = document.getElementById('capTitle'), nA = document.getElementById('nA'), nB = document.getElementById('nB');
if (!CONFIG.caption) document.querySelector('.caption').style.display = 'none';
capTitle.textContent = CONFIG.portraits[0].title; capTitle.style.transition = 'opacity .5s ease';
const label = i => '(#' + String(i + 1).padStart(3, '0') + ')';
const setCaption = p => { nA.style.opacity = 1 - p; nB.style.opacity = p; };
const showCaption = i => { nA.textContent = label(i); nB.textContent = ''; setCaption(0); };

/* ===== Activity: how strongly the pointer is affecting the image right now ===== */
const act = { speed: 0, motion: 0, pulse: 0, lastX: 0, lastY: 0, lastT: 0, px: .5, py: .5, zoom: 1 };   // px,py: pointer on the image (0-1); zoom: current scale
const gest = { down: false, moved: false, sx: 0, sy: 0 };
function aim(e) { const r = cv.getBoundingClientRect(); act.px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); act.py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)); }
function poke(x, y, now) {                           // called on every pointer move
  if (act.lastT) act.speed = act.speed * .5 + Math.hypot(x - act.lastX, y - act.lastY) / Math.max(1, now - act.lastT) * 1000 * .5;
  act.lastX = x; act.lastY = y; act.lastT = now;
}

/* ===== Hovered shape: grows outward from the pointer through pixels of similar color, always taking the cheapest next step.
   Similar colors are cheap and a smooth random landscape adds lobes, so the edge spreads like a stain, not like a circle. ===== */
let GW = 0, GH = 0, ref = new WeakMap(), regs = [], shown = null, growing = null, shapeLevel = 0;   // shape grid size; color cache; two shapes; overall visibility 0-1
function mkRegion() {
  const c = document.createElement('canvas'); c.width = GW; c.height = GH;
  const x = c.getContext('2d'), img = x.createImageData(GW, GH);
  return { cv: c, x, img, px: new Uint32Array(img.data.buffer), vis: new Uint8Array(GW * GH), hk: new Float32Array(GW * GH), hi: new Int32Array(GW * GH), hn: 0, popKey: 0,
    nz1: new Float32Array(81), nz2: new Float32Array(625), nz3: new Float32Array(3721), alpha: 0,
    n: 0, x0: 0, y0: 0, x1: 0, y1: 0, cx: 0, cy: 0, cr: 0, cg: 0, cb: 0, tol: 0, tries: 0, done: false, dirty: false, data: null };
}
function initShape() {
  const k = CONFIG.shapeRes / Math.max(W, H);
  GW = Math.max(8, Math.round(W * k)); GH = Math.max(8, Math.round(H * k));
  ref = new WeakMap(); regs = [mkRegion(), mkRegion()]; shown = growing = null;
}
function refOf(cn) {                                 // low-resolution colors of image A or B, to compare against
  let r = ref.get(cn);
  if (!r) {
    const c = document.createElement('canvas'); c.width = GW; c.height = GH;
    const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(cn, 0, 0, GW, GH);
    r = x.getImageData(0, 0, GW, GH).data; ref.set(cn, r);
  }
  return r;
}
function hpush(R_, k, i) {                           // a small priority queue: the cheapest cell comes out first
  let c = R_.hn++; const hk = R_.hk, hi = R_.hi;
  while (c > 0) { const p = (c - 1) >> 1; if (hk[p] <= k) break; hk[c] = hk[p]; hi[c] = hi[p]; c = p; }
  hk[c] = k; hi[c] = i;
}
function hpop(R_) {
  const hk = R_.hk, hi = R_.hi, top = hi[0]; R_.popKey = hk[0];
  const n = --R_.hn;
  if (n > 0) {
    const k = hk[n], i = hi[n]; let c = 0;
    for (;;) { let l = 2 * c + 1; if (l >= n) break; if (l + 1 < n && hk[l + 1] < hk[l]) l++; if (hk[l] >= k) break; hk[c] = hk[l]; hi[c] = hi[l]; c = l; }
    hk[c] = k; hi[c] = i;
  }
  return top;
}
function bil(a, n, u, v) {                           // smooth value noise on an (n+1) x (n+1) grid
  const x0 = Math.min(n - 1, u | 0), y0 = Math.min(n - 1, v | 0);
  let fx = u - x0, fy = v - y0; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const i = y0 * (n + 1) + x0, a0 = a[i] + (a[i + 1] - a[i]) * fx, a1 = a[i + n + 1] + (a[i + n + 2] - a[i + n + 1]) * fx;
  return a0 + (a1 - a0) * fy;
}
function resetRegion(R_) {                           // (re)start growing from the seed cell
  R_.vis.fill(0); R_.px.fill(0); R_.x.clearRect(0, 0, GW, GH);
  const rnd = mulberry32(hash32(seed ^ Math.imul(R_.cx + 1, 73856093) ^ Math.imul(R_.cy + 1, 19349663), 7));   // the landscape depends only on seed and place, so it can be repeated
  for (let k = 0; k < R_.nz1.length; k++) R_.nz1[k] = rnd();
  for (let k = 0; k < R_.nz2.length; k++) R_.nz2[k] = rnd();
  for (let k = 0; k < R_.nz3.length; k++) R_.nz3[k] = rnd();
  const i = R_.cy * GW + R_.cx;
  R_.vis[i] = 1; R_.hn = 0; hpush(R_, 0, i); R_.n = 0; R_.done = false;
  R_.x0 = R_.x1 = R_.cx; R_.y0 = R_.y1 = R_.cy; R_.dirty = true;
}
function startRegion(R_, cx, cy, tol, data) {
  R_.data = data; R_.cx = cx; R_.cy = cy; R_.tol = tol; R_.tries = 0; R_.alpha = 0;
  let r = 0, g = 0, b = 0, k = 0;                    // the seed color: average of the 3x3 cells around the pointer
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const o = (Math.min(GH - 1, Math.max(0, cy + dy)) * GW + Math.min(GW - 1, Math.max(0, cx + dx))) * 4;
    r += data[o]; g += data[o + 1]; b += data[o + 2]; k++;
  }
  R_.cr = r / k; R_.cg = g / k; R_.cb = b / k;
  resetRegion(R_);
}
function grow(R_, budget, limit) {                   // adds the cheapest cells next to the shape, a limited number per frame
  if (R_.done) return;
  const d = R_.data, vis = R_.vis, px = R_.px, tol = R_.tol, t2 = tol * tol, cap = Math.min(limit, CONFIG.shapeMaxArea * GW * GH), noise = CONFIG.shapeNoise;
  let steps = 0, grew = false;
  while (R_.hn > 0 && steps < budget && R_.n < cap) {
    const i = hpop(R_), key = R_.popKey, x = i % GW, y = (i - x) / GW; steps++;
    px[i] = 0xFFFFFFFF; R_.n++; grew = true;
    if (x < R_.x0) R_.x0 = x; if (x > R_.x1) R_.x1 = x; if (y < R_.y0) R_.y0 = y; if (y > R_.y1) R_.y1 = y;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const j = ny * GW + nx; if (vis[j]) continue;
      const o = j * 4, dr = d[o] - R_.cr, dg = d[o + 1] - R_.cg, db = d[o + 2] - R_.cb, d2 = dr * dr + dg * dg + db * db;
      if (d2 > t2) { vis[j] = 2; continue; }
      vis[j] = 1;
      const lobes = .5 * bil(R_.nz1, 8, nx / GW * 8, ny / GH * 8) + .35 * bil(R_.nz2, 24, nx / GW * 24, ny / GH * 24) + .15 * bil(R_.nz3, 60, nx / GW * 60, ny / GH * 60);   // 0-1, smooth landscape
      hpush(R_, key + (dx && dy ? 1.414 : 1) * (.35 + noise * lobes) * (1 + 1.5 * Math.sqrt(d2) / tol), j);   // valleys of the landscape and similar colors are cheap: the shape flows along them
    }
  }
  if (grew) R_.dirty = true;
  if (R_.n >= cap) R_.done = true;
  else if (R_.hn === 0) {                            // no more similar pixels around
    if (R_.n < CONFIG.shapeMinCells && R_.tries < 4) { R_.tries++; R_.tol *= 1.6; resetRegion(R_); }   // too small: loosen the tolerance and grow again
    else R_.done = true;
  }
}
function updateShape(dt, present) {
  for (const r of regs) r.alpha += ((r === shown ? 1 : 0) - r.alpha) * (1 - Math.exp(-dt / CONFIG.shapeSwapMs));   // old and new shapes cross-fade slowly
  if (!GW || !present) return;                       // when you leave, the shape stays and just fades away
  const cn = lastQ < .5 ? A : B; if (!cn) return;
  const data = refOf(cn), cx = Math.min(GW - 1, Math.floor(act.px * GW)), cy = Math.min(GH - 1, Math.floor(act.py * GH));
  const near = R_ => { const o = (cy * GW + cx) * 4, dr = data[o] - R_.cr, dg = data[o + 1] - R_.cg, db = data[o + 2] - R_.cb; return dr * dr + dg * dg + db * db <= R_.tol * R_.tol; };
  if (!shown) { shown = growing = regs[0]; startRegion(shown, cx, cy, CONFIG.shapeTolerance, data); }
  else if (growing === shown) {
    if (!near(shown)) { growing = shown === regs[0] ? regs[1] : regs[0]; startRegion(growing, cx, cy, CONFIG.shapeTolerance, data); }   // moved onto another color
  } else if (!near(growing)) startRegion(growing, cx, cy, CONFIG.shapeTolerance, data);                                             // moved again before the new shape was ready
  grow(growing, CONFIG.shapeSpeed * dt / 16.7, Infinity);
  if (growing !== shown && (growing.n >= CONFIG.shapeMinCells || growing.done)) shown = growing;   // the new shape takes over once it is big enough
}
let shapeC = null;
function drawRegion(R_, a) {                         // shows the incoming image / blend inside one shape, with hard edges
  if (R_.dirty) { R_.x.putImageData(R_.img, 0, 0, R_.x0, R_.y0, R_.x1 - R_.x0 + 1, R_.y1 - R_.y0 + 1); R_.dirty = false; }
  const kx = W / GW, ky = H / GH, bx = Math.floor(R_.x0 * kx), by = Math.floor(R_.y0 * ky);
  const bw = Math.min(W - bx, Math.ceil((R_.x1 + 1) * kx) - bx), bh = Math.min(H - by, Math.ceil((R_.y1 + 1) * ky) - by);
  if (bw < 1 || bh < 1) return;
  if (!shapeC) shapeC = document.createElement('canvas');
  if (shapeC.width < bw || shapeC.height < bh) { shapeC.width = Math.max(shapeC.width, bw); shapeC.height = Math.max(shapeC.height, bh); }
  const tc = shapeC.getContext('2d'), src = (CONFIG.style === 'blend' && C) ? C : B;
  tc.globalCompositeOperation = 'source-over'; tc.clearRect(0, 0, shapeC.width, shapeC.height);
  tc.drawImage(src, bx, by, bw, bh, 0, 0, bw, bh);
  tc.globalCompositeOperation = 'destination-in'; tc.imageSmoothingEnabled = false;      // no smoothing: the edge follows the cells exactly
  tc.drawImage(R_.cv, bx / kx, by / ky, bw / kx, bh / ky, 0, 0, bw, bh);
  tc.imageSmoothingEnabled = true;
  ctx.globalAlpha = a; ctx.drawImage(shapeC, 0, 0, bw, bh, bx, by, bw, bh); ctx.globalAlpha = 1;
}
function drawShape(p) {
  const lv = shapeLevel * Math.min(1, .6 + .4 * effE) * CONFIG.react.reveal;
  if (lv < .01 || p <= 0 || p >= 1 || !B) return;
  for (const R_ of regs) { const a = lv * R_.alpha; if (a >= .01 && R_.n > 1) drawRegion(R_, a); }
}

function size() {
  const cw = cv.clientWidth, ch = cv.clientHeight;
  const d = Math.min(window.devicePixelRatio || 1, Math.sqrt(12e6 / (cw * ch)));   // native resolution, capped for safety
  W = cv.width = Math.round(cw * d);
  H = cv.height = Math.round(ch * d);
  initShape();
}

function fit(img) {  // draw an image to fill the canvas (cover)
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = Math.max(W / iw, H / ih), w = iw * s, h = ih * s;
  c.getContext('2d').drawImage(img, (W - w) * CONFIG.focus[0], (H - h) * CONFIG.focus[1], w, h);
  return c;
}

function demo() {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960;
  const x = c.getContext('2d'), r = (a, b) => a + Math.random() * (b - a);
  const g = x.createLinearGradient(0, 0, r(0, 540), 960);
  for (let k = 0; k < 3; k++) g.addColorStop(k / 2, `hsl(${r(0,360)|0},${r(40,90)|0}%,${r(15,65)|0}%)`);
  x.fillStyle = g; x.fillRect(0, 0, 540, 960);
  for (let k = 0; k < 6; k++) { x.fillStyle = `hsla(${r(0,360)|0},70%,55%,.5)`;
    x.beginPath(); x.arc(r(0,540), r(0,960), r(40,200), 0, 7); x.fill(); }
  return c;
}

const sizesAsc = [...CONFIG.sizes].sort((x, y) => x - y);
function pickSizes() {
  if (!sizesAsc.length) return [null];
  let need = Math.max(W || 0, H || 0);
  if (navigator.connection && navigator.connection.saveData) need *= .6;
  let k = sizesAsc.findIndex(s => s >= need * .8);
  if (k < 0) k = sizesAsc.length - 1;
  return [...sizesAsc.slice(k), ...sizesAsc.slice(0, k).reverse()];
}
const srcFor = (item, size) => item.src || (size ? `${item.dir}/${size}/${item.file}` : `${item.dir}/${item.file}`);
function loadFirst(item, tries) {
  return new Promise(resolve => {
    let n = 0;
    const next = () => {
      if (n >= tries.length) return resolve(demo());
      const im = new Image(); if (CONFIG.imageCors) im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im); im.onerror = next; im.src = srcFor(item, tries[n++]);
    };
    next();
  });
}
function getImage(i) {
  const tries = pickSizes(), key = i + '@' + tries[0];
  if (cache.has(key)) return cache.get(key);
  const list = imgs();
  const p = list.length ? loadFirst(list[i], tries) : Promise.resolve(demo());
  cache.set(key, p);
  if (cache.size > 4) cache.delete(cache.keys().next().value);
  return p;
}

function nextIndex() {
  const n = count();
  if (CONFIG.order === 'shuffle') {
    if (!queue.length) { queue = [...Array(n).keys()].sort(() => R() - .5);
      if (n > 1 && queue[queue.length - 1] === idxB) queue.reverse(); }
    return queue.pop();
  }
  return (idxB + 1) % n;
}

/* C = image A with image B laid over it using the blend mode, mixed in during the transition */
function makeBlend() {
  if (CONFIG.style !== 'blend') return;
  C = document.createElement('canvas'); C.width = W; C.height = H;
  const c = C.getContext('2d');
  c.drawImage(A, 0, 0);
  c.globalCompositeOperation = curMode; c.drawImage(B, 0, 0);
}

function draw(p) {  // p: 0 = image A, 1 = image B
  lastQ = p;
  if (!A) return;
  drawBase(p);
  drawShape(p);
}
function drawBase(p) {
  setCaption(p);
  ctx.drawImage(A, 0, 0);
  if (p <= 0) return;
  if (p >= 1) { ctx.drawImage(B, 0, 0); return; }
  if (CONFIG.style === 'blend' && C) {
    ctx.globalAlpha = p; ctx.drawImage(B, 0, 0);
    const base = CONFIG.blendAmount, amt = base + (live.amount - base) * effE;      // random strength, driven by hover and pointer
    const floor = CONFIG.hoverFloor * effE, edge = Math.min(1, p / .08, (1 - p) / .08);
    ctx.globalAlpha = Math.min(1, amt * (floor + (1 - floor) * Math.sin(Math.PI * p)) * edge); ctx.drawImage(C, 0, 0);
    ctx.globalAlpha = 1; return;
  }
  ctx.globalAlpha = p; ctx.drawImage(B, 0, 0); ctx.globalAlpha = 1;
}

async function advance() {
  const e = epoch;
  idxB = nextIndex();
  const im = await getImage(idxB);
  if (e !== epoch) return;                          // portrait changed while loading
  if (frozen) { idxB = idxA; phase = 'hold'; t0 = performance.now(); return; }
  imgB = im;
  if (applyAspect(im)) {                            // different proportions: show it directly, no dissolve
    size(); B = fit(imgB); A = B; imgA = imgB; ctx.drawImage(A, 0, 0);
    idxA = idxB; lastQ = 0; showCaption(idxA); phase = 'hold'; t0 = performance.now(); return;
  }
  tn++; R = mulberry32(hash32(seed, tn)); roll(ROLL.transition);       // new random look for this transition
  const hovering = CONFIG.hover && performance.now() - mouse.last < CONFIG.hoverIdleMs;
  curMode = hovering ? CONFIG.hoverModes[Math.floor(R() * CONFIG.hoverModes.length)] : CONFIG.blendMode;
  curMs = CONFIG.transitionMs;
  prog = 0;
  B = fit(imgB); makeBlend();
  nA.textContent = label(idxA); nB.textContent = label(idxB);
  phase = 'dissolve'; t0 = performance.now();
  if (CONFIG.order !== 'shuffle') getImage((idxB + 1) % count());  // preload the next one
}

/* ===== Click to freeze, share, replay ===== */
let frozen = false, replay = false, snap = null, frozenAt = 0;
const r4 = v => Math.round(v * 1e4) / 1e4;
const enc = o => btoa(JSON.stringify(o)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const dec = s => JSON.parse(atob(s.replace(/-/g, '+').replace(/_/g, '/')));
function makeSnap() {                                // everything needed to redraw this exact frame, including the hovered shape
  return { v: 2, seed, n: tn, portrait: cur, a: idxA, b: lastQ > 0 ? idxB : idxA, p: r4(lastQ), mode: curMode, style: CONFIG.style,
    amt: r4(CONFIG.blendAmount), live: r4(live.amount), floor: r4(CONFIG.hoverFloor), e: r4(effE), asp: r4(aspect), focus: CONFIG.focus,
    lv: r4(shapeLevel), shape: shown && shown.n > 1 ? { x: r4(shown.cx / GW), y: r4(shown.cy / GH), tol: r4(shown.tol), n: shown.n } : null };
}
function freeze(x, y) { if (frozen) return; frozen = true; frozenAt = performance.now(); snap = makeSnap(); openMenu(x, y); }
function unfreeze() {
  if (!frozen) return;
  frozen = false; snap = null; lastNow = performance.now(); closeMenu();
  if (replay) {                                      // a piece opened from a link: finish its transition and carry on
    replay = false; A = B; imgA = imgB; idxA = idxB; lastQ = 0; prog = 0; ctx.drawImage(A, 0, 0); showCaption(idxA);
    phase = 'hold'; t0 = performance.now();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
}
const pieceLink = () => location.origin + location.pathname + '#p=' + enc(snap || makeSnap());   // opens this frame
function shareOnX() {                                // first version: opens X with the title and a link to this frame (the real posting flow comes later)
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(CONFIG.portraits[cur].title) + '&url=' + encodeURIComponent(pieceLink()), '_blank', 'noopener');
}
async function saveImage() {                         // (not in the menu yet) the image exactly as on screen: share sheet, or a download
  try {
    cv.toBlob(async blob => {
      if (!blob) return;
      const name = `piece-${seed.toString(16)}-${tn}.png`, file = new File([blob], name, { type: 'image/png' });
      try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: CONFIG.portraits[cur].title }); return; } }
      catch (err) { if (err && err.name === 'AbortError') return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  } catch (e) {}
}
async function loadPiece(s) {                        // redraw a saved piece exactly
  seed = s.seed; tn = s.n; cur = Math.min(s.portrait, CONFIG.portraits.length - 1);
  aspect = s.asp; setBox(); CONFIG.focus = s.focus; size();
  idxA = s.a; idxB = s.b; imgA = await getImage(idxA); imgB = idxB === idxA ? imgA : await getImage(idxB);
  A = fit(imgA); B = fit(imgB);
  curMode = s.mode; CONFIG.style = s.style; CONFIG.blendAmount = s.amt; CONFIG.hoverFloor = s.floor; live.amount = s.live; effE = s.e;
  if (s.shape) {                                     // regrow the same shape: same seed, tolerance and size give the same pixels
    const R_ = regs[0]; shown = growing = R_;
    startRegion(R_, Math.round(s.shape.x * GW), Math.round(s.shape.y * GH), s.shape.tol, refOf(s.p < .5 ? A : B));
    R_.tries = 4; grow(R_, Infinity, s.shape.n); R_.alpha = 1; shapeLevel = s.lv == null ? 1 : s.lv;
  }
  makeBlend(); draw(s.p); showCaption(idxA);
  frozen = true; replay = true; snap = s; phase = 'hold'; t0 = performance.now();   // a click continues
}

function frame(now) {
  const dt = Math.min(now - lastNow, 50); lastNow = now;
  if (!frozen) {
    const RC = CONFIG.react;
    if (CONFIG.hover) {
      const present = now - mouse.last < CONFIG.hoverIdleMs;
      energy += ((present ? 1 : 0) - energy) * (1 - Math.exp(-dt / (present ? RC.attackMs : CONFIG.hoverFadeMs)));   // rises fast, fades slowly
      if (present && now - mouse.roll > CONFIG.hoverEveryMs) {
        mouse.roll = now;
        live.target = CONFIG.hoverAmount[0] + R() * (CONFIG.hoverAmount[1] - CONFIG.hoverAmount[0]);
      }
      live.amount += (live.target - live.amount) * CONFIG.hoverGlide;
      shapeLevel += ((present ? 1 : 0) - shapeLevel) * (1 - Math.exp(-dt / (present ? CONFIG.shapeFadeInMs : CONFIG.shapeFadeOutMs)));   // appears and fades slowly
      act.speed *= Math.exp(-dt / 120);              // speed dies out when the pointer stops
      act.motion += (Math.min(1, act.speed / RC.speedRef) - act.motion) * (1 - Math.exp(-dt / 70));
      act.pulse = Math.max(0, act.pulse - dt / RC.pulseMs);
      effE = Math.min(1, energy * RC.base + act.motion * RC.motion + act.pulse);   // presence + pointer speed + click burst
      updateShape(dt, present);
    } else { effE = 0; shapeLevel = 0; }
  }
  act.zoom += ((gest.down || frozen ? 1 + CONFIG.react.zoom : 1) - act.zoom) * (1 - Math.exp(-dt / 90));       // grows while pressed or while the menu is open
  cv.style.transform = Math.abs(act.zoom - 1) < .0005 ? '' : `scale(${act.zoom})`;
  if (frozen && !replay && now - frozenAt > CONFIG.freezeMs) unfreeze();     // a frozen frame lets go by itself
  if (frozen) { requestAnimationFrame(frame); return; }
  if (phase === 'dissolve') {
    prog += dt / curMs * (1 + CONFIG.react.boost * effE);   // reacting makes the dissolve run faster
    if (prog >= 1) { draw(1); imgA = imgB; A = B; idxA = idxB; lastQ = 0; showCaption(idxA); prog = 0; phase = 'hold'; t0 = now; }
    else draw(CONFIG.ease ? prog * prog * (3 - 2 * prog) : prog);
  } else if (phase === 'hold' && (now - t0 >= CONFIG.holdMs || (CONFIG.react.skipHold && effE > .3))) { phase = 'loading'; advance(); }
  requestAnimationFrame(frame);
}

async function start() {
  setBox(); size();
  let piece = null; try { if (location.hash.startsWith('#p=')) piece = dec(location.hash.slice(3)); } catch (e) {}
  if (piece) { try { await loadPiece(piece); requestAnimationFrame(frame); return; } catch (e) { frozen = false; replay = false; } }
  idxB = -1; idxA = nextIndex(); idxB = idxA;
  imgA = await getImage(idxA); applyAspect(imgA); size(); A = fit(imgA); ctx.drawImage(A, 0, 0); showCaption(idxA);
  phase = 'hold'; t0 = performance.now();
  requestAnimationFrame(frame);
}

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  if (!imgA) return; size(); A = fit(imgA); B = imgB && (phase === 'dissolve' || replay) ? fit(imgB) : B;
  if (phase === 'dissolve' || replay) makeBlend();
  draw(lastQ); }, 60); });

/* ===== Touch and mouse =====
   Moving, touching and the wheel make the image react and the hovered shape follow the pointer.
   A click or tap freezes the frame and opens a menu where you clicked. The next click closes it and continues (or it does after freezeMs). */
const ctxEl = document.getElementById('ctx');
function openMenu(x, y) {                            // opens like a right-click menu, at the pointer
  ctxEl.hidden = false;
  const w = ctxEl.offsetWidth, h = ctxEl.offsetHeight;
  ctxEl.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  ctxEl.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
}
const closeMenu = () => { ctxEl.hidden = true; };
document.getElementById('shX').addEventListener('click', () => { shareOnX(); unfreeze(); });
document.addEventListener('pointerdown', e => {     // while frozen, the next click anywhere else closes the menu and continues (and does nothing else)
  if (frozen && !ctxEl.contains(e.target)) { e.stopPropagation(); e.preventDefault(); unfreeze(); }
}, true);
cv.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const now = performance.now();
  Object.assign(gest, { down: true, moved: false, sx: e.clientX, sy: e.clientY });
  mouse.last = now; act.pulse = Math.max(act.pulse, .4); aim(e);   // the image answers the moment it is touched
});
cv.addEventListener('pointermove', e => {
  const now = performance.now();
  aim(e);
  if (CONFIG.hover) { mouse.last = now; poke(e.clientX, e.clientY, now); }
  if (gest.down && !gest.moved && Math.hypot(e.clientX - gest.sx, e.clientY - gest.sy) > CONFIG.tapSlop) gest.moved = true;
});
function endPress(e, cancelled) {
  if (!gest.down) return;
  gest.down = false;
  if (!cancelled && !gest.moved) { act.pulse = 1; freeze(e.clientX, e.clientY); }   // a click or tap: freeze and open the menu
}
cv.addEventListener('pointerup', e => endPress(e, false));
cv.addEventListener('pointercancel', e => endPress(e, true));
cv.addEventListener('pointerleave', () => { if (!gest.down) { mouse.last = -1e9; act.lastT = 0; } });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => {                     // scrolling (wheel or trackpad) also makes the image react
  e.preventDefault(); if (!CONFIG.hover) return;
  mouse.last = performance.now(); act.speed = Math.max(act.speed, Math.min(3000, (Math.abs(e.deltaX) + Math.abs(e.deltaY)) * 12));
}, { passive: false });

/* The page never scrolls, zooms or pulls to refresh (menu list excepted) */
document.addEventListener('touchmove', e => { if (!e.target.closest('nav')) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
let lastEnd = 0;                                   // two quick touches never zoom the page
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastEnd < 350 && !e.target.closest('nav, .menu-btn, .ctx')) e.preventDefault(); lastEnd = n; }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());

/* Switching portrait: the new portrait dissolves in from whatever is on screen */
function selectPortrait(k) {
  if (k === cur) return;
  if (frozen) unfreeze();
  cur = k; epoch++; cache.clear(); queue = []; idxB = -1;
  if (A) { const s = document.createElement('canvas'); s.width = W; s.height = H;
    s.getContext('2d').drawImage(cv, 0, 0); A = s; imgA = s; }
  capTitle.style.opacity = 0;
  setTimeout(() => { capTitle.textContent = CONFIG.portraits[k].title; capTitle.style.opacity = 1; }, 500);
  phase = 'loading'; advance();
}

start();

const btn = document.getElementById('btn'), menu = document.getElementById('menu');
const setOpen = o => { menu.classList.toggle('open', o); btn.setAttribute('aria-expanded', o); if (!o) setDrop(false); };
const pBtn = document.getElementById('portraitsBtn'), pList = document.getElementById('portraitList');
const setDrop = o => { pList.classList.toggle('open', o); pBtn.setAttribute('aria-expanded', o); pBtn.lastElementChild.textContent = o ? '\u2212' : '+'; };
pBtn.addEventListener('click', () => setDrop(!pList.classList.contains('open')));
CONFIG.portraits.forEach((p, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.textContent = p.title; b.setAttribute('aria-current', i === cur);
  b.addEventListener('click', () => {
    selectPortrait(i);
    pList.querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-current', j === i));
    setOpen(false);
  });
  li.appendChild(b); pList.appendChild(li);
});
btn.addEventListener('click', () => setOpen(!menu.classList.contains('open')));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { setOpen(false); unfreeze(); } });
menu.addEventListener('click', e => { if (e.target.tagName === 'A') setOpen(false); });
</script>
</body>
