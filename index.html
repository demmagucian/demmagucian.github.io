<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Demma Guciàn</title>
<style>
  :root { color-scheme: light; --ink: #111; --m: clamp(16px, 4vw, 56px); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; touch-action: manipulation; background: #fff; color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; touch-action: pan-y; }
  canvas { display: block; height: auto; background: #fff; touch-action: pan-y; outline: none; cursor: pointer; will-change: transform;
    box-shadow: 0 12px 40px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.08); }

  .menu-btn { position: fixed; z-index: 3;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    width: 48px; height: 48px; border: 0; background: transparent; cursor: pointer;
    mix-blend-mode: difference; color: #fff; transition: transform .3s ease; }
  .menu-btn span { position: absolute; background: currentColor; }
  .menu-btn span:nth-child(1) { left: 12px; right: 12px; top: 23px; height: 2px; }
  .menu-btn span:nth-child(2) { top: 12px; bottom: 12px; left: 23px; width: 2px; }
  .menu-btn[aria-expanded="true"] { transform: rotate(45deg); }
  .menu-btn:focus-visible, nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .caption { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none;
    padding: 0 max(20px, env(safe-area-inset-left, 0px)) 0 max(20px, env(safe-area-inset-right, 0px));
    color: #fff; mix-blend-mode: difference; letter-spacing: .06em; font-variant-numeric: tabular-nums;
    z-index: 1; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    white-space: normal; text-wrap: balance; overflow-wrap: anywhere; line-height: 1.35;
    font-size: clamp(.75rem, .6rem + 1.2vw, 1.1rem); }
  .cap-num { display: inline-grid; }
  .cap-num span { grid-area: 1 / 1; }
  nav { position: fixed; z-index: 2; top: 0; right: 0; bottom: 0;
    width: min(320px, 85vw); padding: 96px 32px 32px; touch-action: pan-y;
    background: rgba(255,255,255,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transform: translateX(100%); visibility: hidden;
    transition: transform .35s ease, visibility 0s .35s; }
  nav.open { transform: none; visibility: visible; transition: transform .35s ease; }
  nav a { display: block; padding: 14px 0; color: var(--ink); text-decoration: none;
    font-size: 1.6rem; border-bottom: 1px solid rgba(0,0,0,.14); }
  nav a:hover { opacity: .65; }
  nav .drop { display: flex; width: 100%; justify-content: space-between; align-items: center;
    padding: 14px 0; background: none; border: 0; border-bottom: 1px solid rgba(0,0,0,.14);
    color: var(--ink); font: inherit; font-size: 1.6rem; text-align: left; cursor: pointer; }
  nav .drop:hover { opacity: .65; }
  .sublist { list-style: none; padding: 0; overflow: hidden; max-height: 0; visibility: hidden;
    transition: max-height .35s ease, visibility 0s .35s; }
  .sublist.open { max-height: 60dvh; overflow-y: auto; visibility: visible; transition: max-height .35s ease; }
  .sublist button { display: block; width: 100%; padding: 12px 0 12px 16px; background: none; border: 0;
    color: var(--ink); font: inherit; font-size: 1.05rem; line-height: 1.35; text-align: left;
    cursor: pointer; opacity: .65; }
  .sublist button:hover, .sublist button[aria-current="true"] { opacity: 1; }
  .sublist button:focus-visible, nav .drop:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  nav .drop[aria-pressed="false"] { opacity: .45; }
  @media (prefers-reduced-motion: reduce) { nav, .menu-btn, .sublist { transition: none; } }
</style>
</head>
<body>

<div class="stage"><canvas id="c"></canvas></div>
<div class="caption"><span id="capTitle"></span> <span class="cap-num"><span id="nA"></span><span id="nB"></span></span></div>

<button class="menu-btn" id="btn" aria-label="Menu" aria-expanded="false" aria-controls="menu">
  <span></span><span></span>
</button>
<nav id="menu" aria-label="Main">
  <button class="drop" id="portraitsBtn" aria-expanded="false" aria-controls="portraitList">Portraits <span aria-hidden="true">+</span></button>
  <ul class="sublist" id="portraitList"></ul>
  <a href="writing.html">Writing</a>
  <a href="about.html">About</a>
  <a href="mailto:you@example.com">Contact</a>
</nav>

<script>
/* ===== SETTINGS: edit this block only. ===== */
const CONFIG = {
  // Your portraits. Each one has a title and a folder holding images named 001.jpg, 002.jpg ... (lowercase .jpg).
  // To add a portrait, copy the whole { ... } block and add a comma between them.
  portraits: [
    { title: "Study for Self-Portrait with Tortoiseshell Glasses and Hawaiian Shirt, 2026",
      folder: "images/portrait-1",
      count: 4,       // how many images are uploaded right now. Raise it as you upload more (up to 100)
      url: "" }       // reserved for a marketplace link per image (not used yet)
  ],
  seed: null,           // null = a new random seed on every visit. A number (e.g. 12345) = the same random choices every time
  transitionMs: 6000,   // time for one full dissolve from one image to the next
  holdMs: 0,            // pause on each image between dissolves (0 = continuous)
  order: "sequence",    // "sequence" or "shuffle"
  imageBase: "",        // where your image folders live. "" = same site. With R2: "https://images.yourdomain.com/" (keep the final slash)
  imageCors: false,     // set true ONLY if images come from another address (R2) whose CORS settings allow your site; saving a piece needs it
  sizes: [],            // [] = one size, files directly in the portrait folder. Later: [1600, 3200], one subfolder per size
  caption: false,       // true = show the title and (#001) number at the bottom center
  style: "blend",       // "blend" or "crossfade"
  blendMode: "multiply", // multiply, screen, overlay, soft-light, hard-light, difference, color-dodge, color-burn, luminosity
  blendAmount: 0.7,      // strength of the blend-mode look in the middle (0 = plain crossfade, 1 = full)
  blendIntensity: 0.5,   // overall strength of every blend-mode effect (more saturated, negative, contrasty colors). 1 = as before, 0.5 = half as intense, 0 = none
    ease: true,           // soft start and soft end of each transition
  hover: true,          // while the mouse or a finger is on the image, the transition parameters vary
  hoverModes: ["multiply", "screen", "overlay", "soft-light", "hard-light"],  // blend modes it may pick while hovering
  hoverAmount: [0.2, 1],       // range for the random blend strength
  hoverEveryMs: 900,           // while hovering, a new random strength is picked this often (ms)
  hoverGlide: 0.12,            // how quickly the strength follows each new value (0.06 = lazy, 0.18 = snappy)
  hoverFloor: 0.35,            // how much of the blend shows even at the start and end of a transition (0 = none, 1 = full)
  hoverFadeMs: 800,            // how long the hover effect takes to fade out after you leave
  hoverIdleMs: 1500,           // the mouse or finger counts as present until it has been still this long (ms)

  /* How the image reacts to the mouse, a finger, a click or the wheel. All of it responds at once and fades out when you stop */
  react: {
    base: 0.6,        // effect level while the mouse or finger is simply on the image (0-1)
    motion: 0.8,      // extra level added by how fast the pointer moves (or the wheel turns)
    speedRef: 700,    // pointer speed (px/s) that counts as "full speed". Lower = reacts to gentler movement
    attackMs: 120,    // how fast the effect rises when you arrive (lower = snappier)
    pulseMs: 700,     // a touch or click gives a short burst that fades over this time (ms)
    boost: 0,         // while reacting, the dissolve runs faster: 2 = up to 3x faster at full effect (0 = same speed, no sudden speed-ups)
    skipHold: true,   // true = touching the image ends the pause between dissolves right away
  },
  selection: false,             // magic-wand region reveal is hover-driven, never click-driven
  wandTolerance: 40,            // base colour tolerance for hover region grouping
  wandContiguous: true,
  selectionRes: 640,            // working resolution for connected colour-region detection
  hoverRegionEveryMs: 110,      // minimum time between region recalculations
  hoverRegionFadeMs: 450,       // how quickly the region reveal follows/fades with the pointer
  focus: [0.5, 0.5]     // part of each image that stays in view when the window crops it (0-1, [0.5, 0.5] = center)
};

/* ===== RANDOMNESS ==================================================== */
/* A new random value is drawn for each parameter below at the start of every transition, so no two behave the same.
   The fixed values in CONFIG are just the starting point. All draws come from the seed, so they can be repeated.
   [min, max] = random number between the two   { pick: [...] } = one random choice   { pair: [min, max] } = a random low-high range
   To keep a parameter fixed, delete its line here. To stop all randomness: enabled: false. */
const RANDOM = {
  enabled: true,
  params: {
    transitionMs: [4000, 9000],
    holdMs: [0, 2500],
    order: { pick: ["sequence", "shuffle"] },
    style: { pick: ["blend", "crossfade"] },
    blendMode: { pick: ["multiply", "screen", "overlay", "soft-light", "hard-light", "luminosity"] },
    blendAmount: [0.2, 1],
    hoverAmount: { pair: [0.05, 1] },
    hoverEveryMs: [300, 2500],
    hoverGlide: [0.05, 0.1],
    hoverFloor: [0, 0.7],
    hoverFadeMs: [300, 2000],
    hoverIdleMs: [800, 3000],
    hoverRegionEveryMs: [80, 180],
    wandTolerance: [18, 75],
  }
};
const ROLL = {
  transition: ['transitionMs', 'holdMs', 'order', 'style', 'blendMode', 'blendAmount',
               'hoverAmount', 'hoverEveryMs', 'hoverGlide', 'hoverFloor', 'hoverFadeMs', 'hoverIdleMs'],
  hover: ['wandTolerance', 'hoverRegionEveryMs']
};
/* ===================================================================== */

/* Seeded random numbers: the same seed + transition number always gives the same draws */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash32 = (s, n) => (Math.imul(s ^ 0x9e3779b9, 0x85ebca6b) + Math.imul(n + 1, 0xc2b2ae35)) >>> 0;
let seed = CONFIG.seed != null ? CONFIG.seed >>> 0 : crypto.getRandomValues(new Uint32Array(1))[0];
let tn = 0, R = mulberry32(hash32(seed, 0));         // tn: transition counter; R: random source of the current transition
function roll(keys) {                                // draw new random values for these CONFIG parameters
  if (!RANDOM.enabled) return;
  keys.forEach(k => {
    const sp = RANDOM.params[k]; if (!sp) return;
    const num = (a, b) => { const v = a + R() * (b - a); return b > 10 ? Math.round(v) : v; };
    if (Array.isArray(sp)) CONFIG[k] = num(sp[0], sp[1]);
    else if (sp.pick) CONFIG[k] = sp.pick[Math.floor(R() * sp.pick.length)];
    else if (sp.pair) { const a = num(sp.pair[0], sp.pair[1]), b = num(sp.pair[0], sp.pair[1]); CONFIG[k] = [Math.min(a, b), Math.max(a, b)]; }
  });
}

/* Builds each portrait's image list: folder/001.jpg ... */
CONFIG.portraits.forEach(p => {
  if (p.images) return;
  p.images = Array.from({ length: p.count || 100 }, (_, i) => ({
    dir: CONFIG.imageBase + p.folder, file: `${String(i + 1).padStart(3, '0')}.jpg` }));
});

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let cur = 0, epoch = 0;                              // active portrait, switch counter
const imgs = () => CONFIG.portraits[cur].images;
const count = () => imgs().length || 6;
let W, H, C;
let curMode = CONFIG.blendMode, curMs = CONFIG.transitionMs;           // mode and duration of the current transition
const live = { amount: CONFIG.blendAmount, target: CONFIG.blendAmount };  // blend strength: moves smoothly toward its target
const mouse = { last: -1e9, roll: 0 };                                  // when the mouse or finger was last moving on the image
let energy = 0, effE = 0, lastQ = 0, lastNow = performance.now();      // energy: hover presence 0-1; effE: total effect level; lastQ: loop position 0 (A) to 1 (B)
let imgA, imgB, A, B, idxA = -1, idxB = -1, phase = 'loading', t0 = 0, prog = 0, queue = [];
const cache = new Map();
const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
const held = document.createElement('canvas'), hctx = held.getContext('2d');           // locked areas: pixels picked by tapping
const fadeC = document.createElement('canvas'), fctx = fadeC.getContext('2d');         // pixels that are fading out of the lock
let heldHas = false, selBlocked = false, heldAt = 0, fadeAt = 0;
let hoverRegion = null, hoverRegionAt = 0, hoverRegionKey = '', hoverRegionLevel = 0, hoverStrategy = 'tolerance';
let hoverMaskCanvas = null, hoverMaskCtx = null, hoverLayerCanvas = null, hoverLayerCtx = null;
const entering = document.createElement('canvas');
const enteringCtx = entering.getContext('2d');
let enteringHas = false, enteringAt = 0;

/* The canvas always takes the proportions of the image and fits inside the window with a margin */
let aspect = 3 / 4;
function setBox() {
  cv.style.aspectRatio = aspect;
  cv.style.width = `min(calc(100vw - 2 * var(--m)), calc((100dvh - 2 * var(--m)) * ${aspect}))`;
}
function applyAspect(im) {
  const a = (im.naturalWidth || im.width) / (im.naturalHeight || im.height);
  if (Math.abs(a - aspect) < .005) return false;
  aspect = a; setBox(); return true;
}

/* Caption */
const capTitle = document.getElementById('capTitle'), nA = document.getElementById('nA'), nB = document.getElementById('nB');
if (!CONFIG.caption) document.querySelector('.caption').style.display = 'none';
capTitle.textContent = CONFIG.portraits[0].title; capTitle.style.transition = 'opacity .5s ease';
const label = i => '(#' + String(i + 1).padStart(3, '0') + ')';
const setCaption = p => { nA.style.opacity = 1 - p; nB.style.opacity = p; };
const showCaption = i => { nA.textContent = label(i); nB.textContent = ''; setCaption(0); };

/* ===== Activity: how strongly the pointer is affecting the image right now ===== */
const act = { speed: 0, motion: 0, pulse: 0, lastX: 0, lastY: 0, lastT: 0, px: .5, py: .5, lx: .5, ly: .5, zoom: 1 };   // px,py: pointer on the image (0-1); lx,ly: the reveal following it; zoom: current scale
function aim(e) { const r = cv.getBoundingClientRect(); act.px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); act.py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)); }
function poke(x, y, now) {                           // called on every pointer move
  if (act.lastT) act.speed = act.speed * .5 + Math.hypot(x - act.lastX, y - act.lastY) / Math.max(1, now - act.lastT) * 1000 * .5;
  act.lastX = x; act.lastY = y; act.lastT = now;
}

/* ===== Hover region reveal: the incoming image appears inside the connected colour region under the pointer ===== */
// Hover magic wand: detect one connected colour region beneath the pointer.
function buildHoverRegion(clientX, clientY, now) {
  if (!A || !B || now - hoverRegionAt < CONFIG.hoverRegionEveryMs) return;
  const src = lastQ < .5 ? A : B;
  const r = cv.getBoundingClientRect(), k = CONFIG.selectionRes / Math.max(W, H);
  const w = Math.max(1, Math.round(W * k)), h = Math.max(1, Math.round(H * k));
  const x0 = Math.min(w - 1, Math.max(0, Math.floor((clientX-r.left)/r.width*w)));
  const y0 = Math.min(h - 1, Math.max(0, Math.floor((clientY-r.top)/r.height*h)));
  const key = `${idxA}:${idxB}:${x0>>2}:${y0>>2}:${Math.round(lastQ*12)}`;
  if (key === hoverRegionKey) return;
  hoverRegionAt = now; hoverRegionKey = key;
  roll(ROLL.hover);
  const sample = document.createElement('canvas'); sample.width=w; sample.height=h;
  const sc = sample.getContext('2d',{willReadFrequently:true});
  sc.drawImage(src,0,0,w,h);
  let px; try { px=sc.getImageData(0,0,w,h).data; } catch(err) { hoverRegion=null; return; }
  const seedI=(y0*w+x0)*4, sr=px[seedI], sg=px[seedI+1], sb=px[seedI+2];
  const strategies=['exact','tolerance','quantized'];
  hoverStrategy=strategies[Math.floor(R()*strategies.length)];
  const tol=hoverStrategy==='exact'?0:hoverStrategy==='quantized'?48:CONFIG.wandTolerance;
  const quant=v=>Math.round(v/48)*48;
  const close=i=>{
    const j=i*4; if(hoverStrategy==='quantized') return quant(px[j])===quant(sr)&&quant(px[j+1])===quant(sg)&&quant(px[j+2])===quant(sb);
    const dr=px[j]-sr,dg=px[j+1]-sg,db=px[j+2]-sb; return dr*dr+dg*dg+db*db<=tol*tol;
  };
  const mask=new Uint8Array(w*h), stack=[y0*w+x0]; mask[y0*w+x0]=1;
  while(stack.length){const i=stack.pop(),x=i%w,y=(i-x)/w;
    if(x>0&&!mask[i-1]&&close(i-1)){mask[i-1]=1;stack.push(i-1);}
    if(x<w-1&&!mask[i+1]&&close(i+1)){mask[i+1]=1;stack.push(i+1);}
    if(y>0&&!mask[i-w]&&close(i-w)){mask[i-w]=1;stack.push(i-w);}
    if(y<h-1&&!mask[i+w]&&close(i+w)){mask[i+w]=1;stack.push(i+w);}
  }
  const mc=document.createElement('canvas'); mc.width=w; mc.height=h;
  const mx=mc.getContext('2d'), id=mx.createImageData(w,h);
  for(let i=0;i<mask.length;i++){const j=i*4;id.data[j]=id.data[j+1]=id.data[j+2]=255;id.data[j+3]=mask[i]?255:0;}
  mx.putImageData(id,0,0);
  const full=document.createElement('canvas'); full.width=W; full.height=H;
  const fc=full.getContext('2d'); fc.imageSmoothingEnabled=false; fc.drawImage(mc,0,0,W,H);
  hoverRegion=full;
}
function drawHoverRegion(p) {
  if(!hoverRegion || !B || p<=0 || p>=1 || hoverRegionLevel<=.005) return;
  if(!hoverMaskCanvas || hoverMaskCanvas.width!==W || hoverMaskCanvas.height!==H){
    hoverMaskCanvas=document.createElement('canvas'); hoverMaskCanvas.width=W; hoverMaskCanvas.height=H;
    hoverMaskCtx=hoverMaskCanvas.getContext('2d',{willReadFrequently:true});
    hoverLayerCanvas=document.createElement('canvas'); hoverLayerCanvas.width=W; hoverLayerCanvas.height=H;
    hoverLayerCtx=hoverLayerCanvas.getContext('2d');
  }
  hoverMaskCtx.clearRect(0,0,W,H); hoverMaskCtx.drawImage(hoverRegion,0,0,W,H);
  const md=hoverMaskCtx.getImageData(0,0,W,H), out=hoverMaskCtx.createImageData(W,H);
  for(let i=0;i<W*H;i++){const j=i*4; out.data[j]=out.data[j+1]=out.data[j+2]=255; out.data[j+3]=Math.round(md.data[j+3]*hoverRegionLevel);}
  hoverMaskCtx.putImageData(out,0,0);
  hoverLayerCtx.clearRect(0,0,W,H); hoverLayerCtx.globalCompositeOperation='source-over'; hoverLayerCtx.drawImage(B,0,0);
  hoverLayerCtx.globalCompositeOperation='destination-in'; hoverLayerCtx.drawImage(hoverMaskCanvas,0,0);
  hoverLayerCtx.globalCompositeOperation='source-over'; ctx.drawImage(hoverLayerCanvas,0,0);
}

function size() {
  let snapC = null;                                  // keep the locked areas when the window changes size
  if (heldHas) { snapC = document.createElement('canvas'); snapC.width = held.width; snapC.height = held.height; snapC.getContext('2d').drawImage(held, 0, 0); }
  const cw = cv.clientWidth, ch = cv.clientHeight;
  const d = Math.min(window.devicePixelRatio || 1, Math.sqrt(12e6 / (cw * ch)));   // native resolution, capped for safety
  W = cv.width = Math.round(cw * d);
  H = cv.height = Math.round(ch * d);
  if (CONFIG.selection) { layer.width = W; layer.height = H; }
  const enteringSnap = enteringHas ? document.createElement('canvas') : null;
  if (enteringSnap) { enteringSnap.width = entering.width; enteringSnap.height = entering.height; enteringSnap.getContext('2d').drawImage(entering, 0, 0); }
  held.width = W; held.height = H; fadeC.width = W; fadeC.height = H; entering.width = W; entering.height = H;
  if (snapC) hctx.drawImage(snapC, 0, 0, W, H);
  if (enteringSnap) enteringCtx.drawImage(enteringSnap, 0, 0, W, H);
}

function fit(img) {  // draw an image to fill the canvas (cover)
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = Math.max(W / iw, H / ih), w = iw * s, h = ih * s;
  c.getContext('2d').drawImage(img, (W - w) * CONFIG.focus[0], (H - h) * CONFIG.focus[1], w, h);
  return c;
}

function demo() {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960;
  const x = c.getContext('2d'), r = (a, b) => a + Math.random() * (b - a);
  const g = x.createLinearGradient(0, 0, r(0, 540), 960);
  for (let k = 0; k < 3; k++) g.addColorStop(k / 2, `hsl(${r(0,360)|0},${r(40,90)|0}%,${r(15,65)|0}%)`);
  x.fillStyle = g; x.fillRect(0, 0, 540, 960);
  for (let k = 0; k < 6; k++) { x.fillStyle = `hsla(${r(0,360)|0},70%,55%,.5)`;
    x.beginPath(); x.arc(r(0,540), r(0,960), r(40,200), 0, 7); x.fill(); }
  return c;
}

const sizesAsc = [...CONFIG.sizes].sort((x, y) => x - y);
function pickSizes() {
  if (!sizesAsc.length) return [null];
  let need = Math.max(W || 0, H || 0);
  if (navigator.connection && navigator.connection.saveData) need *= .6;
  let k = sizesAsc.findIndex(s => s >= need * .8);
  if (k < 0) k = sizesAsc.length - 1;
  return [...sizesAsc.slice(k), ...sizesAsc.slice(0, k).reverse()];
}
const srcFor = (item, size) => item.src || (size ? `${item.dir}/${size}/${item.file}` : `${item.dir}/${item.file}`);
function loadFirst(item, tries) {
  return new Promise(resolve => {
    let n = 0;
    const next = () => {
      if (n >= tries.length) return resolve(demo());
      const im = new Image(); if (CONFIG.imageCors) im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im); im.onerror = next; im.src = srcFor(item, tries[n++]);
    };
    next();
  });
}
function getImage(i) {
  const tries = pickSizes(), key = i + '@' + tries[0];
  if (cache.has(key)) return cache.get(key);
  const list = imgs();
  const p = list.length ? loadFirst(list[i], tries) : Promise.resolve(demo());
  cache.set(key, p);
  if (cache.size > 4) cache.delete(cache.keys().next().value);
  return p;
}

function nextIndex() {
  const n = count();
  if (CONFIG.order === 'shuffle') {
    if (!queue.length) { queue = [...Array(n).keys()].sort(() => R() - .5);
      if (n > 1 && queue[queue.length - 1] === idxB) queue.reverse(); }
    return queue.pop();
  }
  return (idxB + 1) % n;
}

/* C = image A with image B laid over it using the blend mode, mixed in during the transition */
function makeBlend() {
  if (CONFIG.style !== 'blend') return;
  C = document.createElement('canvas'); C.width = W; C.height = H;
  const c = C.getContext('2d');
  c.drawImage(A, 0, 0);
  c.globalCompositeOperation = curMode; c.drawImage(B, 0, 0);
}

function draw(p) {  // p: 0 = image A, 1 = image B
  lastQ = p;
  if (!A) return;
  drawBase(p);
  drawHoverRegion(p);
  if (heldHas) ctx.drawImage(held, 0, 0);            // locked areas stay on top, whatever the loop shows
  if (enteringHas) {                                // newly selected pixels ease into the locked image
    const duration = Math.max(0, CONFIG.selectionFadeInMs || 0);
    const raw = duration ? Math.min(1, (performance.now() - enteringAt) / duration) : 1;
    const alpha = raw * raw * (3 - 2 * raw);         // smooth start and finish
    ctx.globalAlpha = alpha; ctx.drawImage(entering, 0, 0); ctx.globalAlpha = 1;
    if (raw >= 1) commitEntering();
  }
  if (fadeAt) {                                      // areas that were just unlocked fade out
    const a = 1 - (performance.now() - fadeAt) / CONFIG.releaseMs;
    if (a <= 0) { fadeAt = 0; fctx.clearRect(0, 0, W, H); }
    else { ctx.globalAlpha = a; ctx.drawImage(fadeC, 0, 0); ctx.globalAlpha = 1; }
  }
}
function drawBase(p) {
  setCaption(p);
  ctx.drawImage(A, 0, 0);
  if (p <= 0) return;
  if (p >= 1) { ctx.drawImage(B, 0, 0); return; }
  if (CONFIG.style === 'blend' && C) {
    ctx.globalAlpha = p; ctx.drawImage(B, 0, 0);
    const base = CONFIG.blendAmount, amt = base + (live.amount - base) * effE;      // random strength, driven by hover and pointer
    const floor = CONFIG.hoverFloor * effE, edge = Math.min(1, p / .08, (1 - p) / .08);
    ctx.globalAlpha = Math.min(1, amt * (floor + (1 - floor) * Math.sin(Math.PI * p)) * edge * CONFIG.blendIntensity); ctx.drawImage(C, 0, 0);
    ctx.globalAlpha = 1; return;
  }
  ctx.globalAlpha = p; ctx.drawImage(B, 0, 0); ctx.globalAlpha = 1;
}

const flash = t => { const w = Math.min(.5, CONFIG.flashMs / curMs); return t < 1 - w ? 0 : (t - (1 - w)) / w; };   // hold, then a quick change at the end
function commitEntering() {
  if (!enteringHas) return;
  hctx.drawImage(entering, 0, 0); heldHas = true;
  enteringCtx.clearRect(0, 0, entering.width, entering.height); enteringHas = false;
}
function clearHeld() {
  hctx.clearRect(0, 0, held.width, held.height);
  enteringCtx.clearRect(0, 0, entering.width, entering.height);
  heldHas = false; enteringHas = false;
}
function releaseHeld() {                            // unlock everything, with a fade
  commitEntering();
  if (!heldHas) return;
  roll(ROLL.release);
  if (CONFIG.releaseMs > 0) { fctx.drawImage(held, 0, 0); fadeAt = performance.now(); }
  clearHeld();
}
async function advance() {
  const e = epoch;
  idxB = nextIndex();
  const im = await getImage(idxB);
  if (e !== epoch) return;                          // portrait changed while loading
  imgB = im;
  if (applyAspect(im)) {                            // different proportions: show it directly, no dissolve
    clearHeld(); size(); B = fit(imgB); A = B; imgA = imgB; ctx.drawImage(A, 0, 0);
    idxA = idxB; lastQ = 0; showCaption(idxA); phase = 'hold'; t0 = performance.now(); return;
  }
  tn++; R = mulberry32(hash32(seed, tn)); roll(ROLL.transition);       // new random look for this transition
  const hovering = CONFIG.hover && performance.now() - mouse.last < CONFIG.hoverIdleMs;
  curMode = hovering ? CONFIG.hoverModes[Math.floor(R() * CONFIG.hoverModes.length)] : CONFIG.blendMode;
  curMs = CONFIG.transitionMs;
  prog = 0;
  B = fit(imgB); makeBlend();
  nA.textContent = label(idxA); nB.textContent = label(idxB);
  phase = 'dissolve'; t0 = performance.now();
  if (CONFIG.order !== 'shuffle') getImage((idxB + 1) % count());  // preload the next one
}

function frame(now) {
  const dt = Math.min(now - lastNow, 50); lastNow = now;
  const RC = CONFIG.react;
  hoverRegionLevel += ((now - mouse.last < CONFIG.hoverIdleMs && hoverRegion ? 1 : 0) - hoverRegionLevel) * (1 - Math.exp(-dt / CONFIG.hoverRegionFadeMs));
  if (CONFIG.hover) {
    const present = now - mouse.last < CONFIG.hoverIdleMs;
    energy += ((present ? 1 : 0) - energy) * (1 - Math.exp(-dt / (present ? RC.attackMs : CONFIG.hoverFadeMs)));   // rises fast, fades slowly
    if (present && now - mouse.roll > CONFIG.hoverEveryMs) {
      mouse.roll = now;
      live.target = CONFIG.hoverAmount[0] + R() * (CONFIG.hoverAmount[1] - CONFIG.hoverAmount[0]);
    }
    live.amount += (live.target - live.amount) * CONFIG.hoverGlide;
    act.speed *= Math.exp(-dt / 120);                // speed dies out when the pointer stops
    act.motion += (Math.min(1, act.speed / RC.speedRef) - act.motion) * (1 - Math.exp(-dt / 70));
    act.pulse = Math.max(0, act.pulse - dt / RC.pulseMs);
    effE = Math.min(1, energy * RC.base + act.motion * RC.motion + act.pulse);   // presence + pointer speed + click burst
  } else { effE = 0; }
  act.zoom += (1 - act.zoom) * (1 - Math.exp(-dt / 90));       // a tiny grow while pressed
  cv.style.transform = Math.abs(act.zoom - 1) < .00005 ? '' : `scale(${act.zoom})`;
  if (phase === 'dissolve') {
    prog += dt / curMs * (1 + RC.boost * effE);      // reacting makes the dissolve run faster
    if (prog >= 1) { draw(1); imgA = imgB; A = B; idxA = idxB; lastQ = 0; showCaption(idxA); prog = 0; phase = 'hold'; t0 = now; }
    else draw(heldHas && CONFIG.flashMs ? flash(prog) : CONFIG.ease ? prog * prog * (3 - 2 * prog) : prog);
  } else if (phase === 'hold' && (now - t0 >= CONFIG.holdMs || (RC.skipHold && effE > .3))) { phase = 'loading'; advance(); }
  if (fadeAt && phase !== 'dissolve') draw(lastQ);  // keep the unlock fade moving during a pause
  requestAnimationFrame(frame);
}

async function start() {
  setBox(); size();
  idxB = -1; idxA = nextIndex(); idxB = idxA;
  imgA = await getImage(idxA); applyAspect(imgA); size(); A = fit(imgA); ctx.drawImage(A, 0, 0); showCaption(idxA);
  phase = 'hold'; t0 = performance.now();
  requestAnimationFrame(frame);
}

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  if (!imgA) return; size(); A = fit(imgA); B = imgB && phase === 'dissolve' ? fit(imgB) : B;
  if (phase === 'dissolve') makeBlend();
  draw(lastQ); }, 60); });

/* ===== Pointer movement drives hover effects; clicks are intentionally inactive ===== */
cv.addEventListener('pointermove', e => {
  const now = performance.now(); aim(e);
  if (CONFIG.hover) { mouse.last = now; poke(e.clientX, e.clientY, now); buildHoverRegion(e.clientX, e.clientY, now); }
});
cv.addEventListener('pointerleave', () => { mouse.last = -1e9; act.lastT = 0; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => {                     // scrolling (wheel or trackpad) also makes the image react
  if (!CONFIG.hover) return;
  mouse.last = performance.now(); act.speed = Math.max(act.speed, Math.min(3000, (Math.abs(e.deltaX) + Math.abs(e.deltaY)) * 12));
}, { passive: true });

/* No page zoom from pinching or double-tapping */
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
let lastEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastEnd < 350 && !e.target.closest('nav, .menu-btn')) e.preventDefault(); lastEnd = n; }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());

/* Switching portrait: the new portrait dissolves in from whatever is on screen */
function selectPortrait(k) {
  if (k === cur) return;
  cur = k; epoch++; cache.clear(); queue = []; idxB = -1; clearHeld();
  if (A) { const s = document.createElement('canvas'); s.width = W; s.height = H;
    s.getContext('2d').drawImage(cv, 0, 0); A = s; imgA = s; }
  capTitle.style.opacity = 0;
  setTimeout(() => { capTitle.textContent = CONFIG.portraits[k].title; capTitle.style.opacity = 1; }, 500);
  phase = 'loading'; advance();
}

start();

const btn = document.getElementById('btn'), menu = document.getElementById('menu');
const setOpen = o => { menu.classList.toggle('open', o); btn.setAttribute('aria-expanded', o); if (!o) setDrop(false); };
const pBtn = document.getElementById('portraitsBtn'), pList = document.getElementById('portraitList');
const setDrop = o => { pList.classList.toggle('open', o); pBtn.setAttribute('aria-expanded', o); pBtn.lastElementChild.textContent = o ? '\u2212' : '+'; };
pBtn.addEventListener('click', () => setDrop(!pList.classList.contains('open')));
CONFIG.portraits.forEach((p, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.textContent = p.title; b.setAttribute('aria-current', i === cur);
  b.addEventListener('click', () => {
    selectPortrait(i);
    pList.querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-current', j === i));
    setOpen(false);
  });
  li.appendChild(b); pList.appendChild(li);
});
btn.addEventListener('click', () => setOpen(!menu.classList.contains('open')));
document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
menu.addEventListener('click', e => { if (e.target.tagName === 'A') setOpen(false); });
</script>
</body>
