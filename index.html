  /* ===== The theme switch is a real light: the ROOM is one layer that follows the lamp; header and footer only change colour ===== */

/* ===== Pictures: one fixed picture per mode (both loaded once, so the switch is instant) ===== */
function brightness(im) {   // overall brightness (0-1) of a picture: drives the skirt strength
  const w = 48, h = Math.max(1, Math.round(w * im.height / im.width)), c = mk(); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingQuality = 'high'; x.drawImage(im, 0, 0, w, h);

const pics = { dark: null, light: null };   // { im, k } for each mode
function loadPicture(file, tries = 0) {

/* ===== Drawing: the picture is painted once per size, picture or mode ===== */
function size() {

let footShift = 0, footLock = false;   // px the footer is moved down (see setBox)
/* The canvas keeps the image's proportions and is as large as possible between the header and the footer, at ANY window size.
   Everything is measured from the real elements. One gap g (= name to top of the page) is kept under the header row and above the footer icons;
   in portrait the image is centered between them. */
function setBox() {
  const stage = homeEl, sw = stage.clientWidth;

  const hdr = R('.site-header')[0], ftr = R('.site-footer')[0], nm = R('.site-name')[0], btn = R('.menu-btn')[0], line1 = R('.site-name .nl')[0];
  const rows = R('.site-footer .social-links > div, .site-footer .theme-row');
  const themeBox = R('.site-footer .theme-stack')[0], socialBox = R('.site-footer .social-stack:not(.theme-stack)')[0];
  const port = stage.clientHeight > sw, room = port ? REFL_ROOM_P : REFL_ROOM, F = 1 + room;
  const lat = port ? HALO_PAD * SIDE_P : HALO_PAD;

  if (hdr && ftr && nm && btn && line1 && rows.length && themeBox && socialBox) {

/* ===== Sections: an item fades the home to black (white); coming back, everything is laid out while the home is still invisible and the fade-in starts on a clean frame ===== */
function showSection(section) {

  clearTimeout(homeHideTimer);
  if (active) {
    homeEl.classList.add('section-mode');
    if (homeVisible) homeHideTimer = setTimeout(() => { homeVisible = false; layoutFX(); }, 1000);   // after the fade-out
  } else if (was) {

  } else homeEl.classList.remove('section-mode');

document.getElementById('homeLink').addEventListener('click', e => { e.preventDefault(); if (mTarget === 1) closeMinus(); else { showSection(null); nameCapTo(1, 500); } });

/* X and Instagram: on phones and tablets they ask to open the app (the phone's own "Open in ...?" question); with no app they fall back to the website.
   On desktop the normal link opens the website in a new tab. */
function appLink(sel, web, iosUrl, androidIntent) {
  document.querySelector(sel).addEventListener('click', e => {
    const ua = navigator.userAgent;
    const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1), android = /Android/i.test(ua);
    if (!ios && !android) return;

    if (android) { location.href = androidIntent + ';S.browser_fallback_url=' + encodeURIComponent(web) + ';end'; return; }
    const t0 = Date.now(); let left = false; const gone = () => { left = true; };
    ['pagehide', 'blur'].forEach(t => window.addEventListener(t, gone, { once: true })); document.addEventListener('visibilitychange', gone, { once: true });
    location.href = iosUrl;
    setTimeout(() => { if (!left && !document.hidden && Date.now() - t0 < 1800) location.href = web; }, 1200);

appLink('[data-link="x"]', 'https://x.com/demma_gucian', 'twitter://user?screen_name=demma_gucian', 'intent://user?screen_name=demma_gucian#Intent;scheme=twitter;package=com.twitter.android');
appLink('[data-link="instagram"]', 'https://www.instagram.com/demma_gucian/', 'instagram://user?username=demma_gucian', 'intent://instagram.com/_u/demma_gucian/#Intent;package=com.instagram.android;scheme=https');

/* ===== Menu: a + that turns like a book page ===== */
const MENU = { flipMs: 650, autoCloseMs: 10000 };
const menuBtn = document.getElementById('menuBtn'), navEl = document.getElementById('mainNav'), vBar = menuBtn.querySelector('.v');
const flipEl = menuBtn.querySelector('.flip'), pulseEl = menuBtn.querySelector('.pulse'), glyphEl = menuBtn.querySelector('svg');
const menuReduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let mP = 0, mTarget = 0, mDist = 1, mGap = 10, mAnim = 0, mTimer = 0, mCount = 0;   // mP: progress 0 (closed) to 1 (open)
let mHome = false, mVertical = false;   // mHome: a section is selected; mVertical: the items unfold downwards (the row would overlap the image)
const mEase = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
/* The name rests as "DG": "emma " and "uciàn" open from left to right as the page turns, and close the same way on the way back */
const nameR = [...document.querySelectorAll('.site-name .nr')]; let nameW = [0, 0];
function setNameOpen(e) {

}

}
let nameCap = 1, nameCapAnim = 0;   // how open the name is allowed to be (1 = follows the menu, 0 = kept as DG)
function nameCapTo(target, ms) {

}
function menuMeasure(skip) {

  nameMeasure(skip);

  const rowW = navEl.offsetWidth;
  const sw = homeEl.clientWidth;
  const pr = parseFloat(getComputedStyle(document.querySelector('.site-header')).paddingRight) || 0;
  const left = sw - pr - (menuBtn.offsetWidth + mGap + rowW);            // left end of "- items" once open
  const nameEl = document.querySelector('.site-name'), nm = nameEl.getBoundingClientRect(), g = nm.top;
  const dgRight = nm.left + [...nameEl.querySelectorAll('.nl')].reduce((s, nl, i) => s + nl.getBoundingClientRect().width - nameR[i].getBoundingClientRect().width, 0);   // the name is "DG" while the menu is open

/* The breathing of the + (closed) and of the - (open), on one clock */
let pulseT0 = 0, pulseLast = 0;
function pulseTick(now) {

function menuCountStart() {   // the - waits for autoCloseMs, then the menu closes

function menuOpen() {

function menuClose() {

navEl.addEventListener('click', e => { if (e.target.closest('a')) menuToHome(); });
menuBtn.addEventListener('click', () => { if (mTarget === 1) closeMinus(); else menuOpen(); });

/* ===== Start: wait for the two pictures, the room photo and the font under the loading screen, then dissolve the loading screen ===== */
const loaderEl = document.getElementById('loader');
function reveal() {
  if (revealed) return; revealed = true;
  document.documentElement.classList.add('ready');
  loaderEl.classList.add('done');
  setTimeout(() => loaderEl.remove(), 1600);
  let first = true;
  if ('ResizeObserver' in window) new ResizeObserver(() => { if (first) first = false; else scheduleLayout(); }).observe(homeEl);
  addEventListener('resize', scheduleLayout);
  setTimeout(loadRoomPhoto, 500);
}
async function boot() {

    root.style.setProperty('--ambilight-rgb', CONFIG.haloColor); root.style.setProperty('--halo-k', CONFIG.haloStrength);
    root.style.setProperty('--room-depth', CONFIG.darkRoomDepth);
    root.style.setProperty('--floor-light', CONFIG.darkFloorLight); root.style.setProperty('--floor-blur', CONFIG.darkFloorBlur + 'px'); root.style.setProperty('--floor-contrast', CONFIG.darkFloorContrast);

}
boot();
