<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Demma Guciàn</title>
<style>
  :root { color-scheme: light; --ink: #111; --m: clamp(16px, 4vw, 56px); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; background: #fff; color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; touch-action: none; }
  canvas { display: block; height: auto; background: #fff; touch-action: none; outline: none; cursor: grab; will-change: transform;
    box-shadow: 0 12px 40px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.08); }

  .menu-btn { position: fixed; z-index: 3;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    width: 48px; height: 48px; border: 0; background: transparent; cursor: pointer;
    mix-blend-mode: difference; color: #fff; transition: transform .3s ease; }
  .menu-btn span { position: absolute; background: currentColor; }
  .menu-btn span:nth-child(1) { left: 12px; right: 12px; top: 23px; height: 2px; }
  .menu-btn span:nth-child(2) { top: 12px; bottom: 12px; left: 23px; width: 2px; }
  .menu-btn[aria-expanded="true"] { transform: rotate(45deg); }
  .menu-btn:focus-visible, nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .share { position: fixed; z-index: 3; right: calc(env(safe-area-inset-right, 0px) + 18px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; flex-direction: column; align-items: flex-end; color: #fff; mix-blend-mode: difference; }
  .share button { background: none; border: 0; color: inherit; font: inherit; font-size: .85rem; letter-spacing: .08em; padding: 10px 6px; cursor: pointer; }
  .share-list { display: flex; flex-direction: column; align-items: flex-end; }
  .share-list[hidden] { display: none; }
  .caption { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none;
    padding: 0 max(20px, env(safe-area-inset-left, 0px)) 0 max(20px, env(safe-area-inset-right, 0px));
    color: #fff; mix-blend-mode: difference; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .caption { z-index: 1; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    white-space: normal; text-wrap: balance; overflow-wrap: anywhere; line-height: 1.35;
    font-size: clamp(.75rem, .6rem + 1.2vw, 1.1rem); }
  .cap-num { display: inline-grid; }
  .cap-num span { grid-area: 1 / 1; }
  nav { position: fixed; z-index: 2; top: 0; right: 0; bottom: 0;
    width: min(320px, 85vw); padding: 96px 32px 32px; touch-action: pan-y;
    background: rgba(255,255,255,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transform: translateX(100%); visibility: hidden;
    transition: transform .35s ease, visibility 0s .35s; }
  nav.open { transform: none; visibility: visible; transition: transform .35s ease; }
  nav a { display: block; padding: 14px 0; color: var(--ink); text-decoration: none;
    font-size: 1.6rem; border-bottom: 1px solid rgba(0,0,0,.14); }
  nav a:hover { opacity: .65; }
  nav .drop { display: flex; width: 100%; justify-content: space-between; align-items: center;
    padding: 14px 0; background: none; border: 0; border-bottom: 1px solid rgba(0,0,0,.14);
    color: var(--ink); font: inherit; font-size: 1.6rem; text-align: left; cursor: pointer; }
  nav .drop:hover { opacity: .65; }
  .sublist { list-style: none; padding: 0; overflow: hidden; max-height: 0; visibility: hidden;
    transition: max-height .35s ease, visibility 0s .35s; }
  .sublist.open { max-height: 60dvh; overflow-y: auto; visibility: visible; transition: max-height .35s ease; }
  .sublist button { display: block; width: 100%; padding: 12px 0 12px 16px; background: none; border: 0;
    color: var(--ink); font: inherit; font-size: 1.05rem; line-height: 1.35; text-align: left;
    cursor: pointer; opacity: .65; }
  .sublist button:hover, .sublist button[aria-current="true"] { opacity: 1; }
  .sublist button:focus-visible, nav .drop:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { nav, .menu-btn, .sublist { transition: none; } }
</style>
</head>
<body>

<div class="stage"><canvas id="c"></canvas></div>
<div class="caption"><span id="capTitle"></span> <span class="cap-num"><span id="nA"></span><span id="nB"></span></span></div>

<div class="share">
  <div class="share-list" id="shareList" hidden>
    <button id="shareX">Share on X</button>
    <button id="shareSave">Save image</button>
  </div>
  <button id="shareBtn" aria-expanded="false" aria-controls="shareList">Share</button>
</div>

<button class="menu-btn" id="btn" aria-label="Menu" aria-expanded="false" aria-controls="menu">
  <span></span><span></span>
</button>
<nav id="menu" aria-label="Main">
  <button class="drop" id="portraitsBtn" aria-expanded="false" aria-controls="portraitList">Portraits <span aria-hidden="true">+</span></button>
  <ul class="sublist" id="portraitList"></ul>
  <button class="drop" id="clearSel">Clear selection</button>
  <a href="writing.html">Writing</a>
  <a href="about.html">About</a>
  <a href="mailto:you@example.com">Contact</a>
</nav>

<script>
/* ===== SETTINGS: edit this block only. ===== */
const CONFIG = {
  // Your portraits. Each one has a title and a folder holding images named 001.jpg, 002.jpg ... (lowercase .jpg).
  // To add a portrait, copy the whole { ... } block and add a comma between them.
  portraits: [
    { title: "Study for Self-Portrait with Tortoiseshell Glasses and Hawaiian Shirt, 2026",
      folder: "images/portrait-1",
      count: 4,       // how many images are uploaded right now. Raise it as you upload more (up to 100)
      url: "" }       // reserved for a marketplace link per image (not used yet)
  ],
  seed: null,           // null = a new random seed on every visit. A number (e.g. 12345) = the same random choices every time
  transitionMs: 4000,   // time for one full dissolve from one image to the next
  holdMs: 0,            // pause on each image between dissolves (0 = continuous)
  order: "sequence",    // "sequence" or "shuffle"
  imageBase: "",        // where your image folders live. "" = same site. With R2: "https://images.yourdomain.com/" (keep the final slash)
  imageCors: false,     // set true ONLY if images come from another address (R2) whose CORS settings allow your site; saving a piece needs it
  sizes: [],            // [] = one size, files directly in the portrait folder. Later: [1600, 3200], one subfolder per size
  caption: false,       // true = show the title and (#001) number at the bottom center
  style: "blend",       // "blend" = crossfade through a blend mode; "crossfade" = plain smooth blend
  blendMode: "multiply", // multiply, screen, overlay, soft-light, hard-light, difference, color-dodge, color-burn, luminosity
  blendAmount: 0.7,      // strength of the blend-mode look in the middle (0 = plain crossfade, 1 = full)
  ease: true,           // soft start and soft end of each transition
  hover: true,          // while the mouse or a finger is on the image, the transition parameters vary
  hoverModes: ["multiply", "screen", "overlay", "soft-light", "hard-light", "difference"],  // blend modes it may pick while hovering
  hoverAmount: [0.2, 1],       // range for the random blend strength
  hoverEveryMs: 900,           // while hovering, a new random strength is picked this often (ms)
  hoverGlide: 0.12,            // how quickly the strength follows each new value (0.06 = lazy, 0.18 = snappy)
  hoverFloor: 0.35,            // how much of the blend shows even at the start and end of a transition (0 = none, 1 = full)
  hoverFadeMs: 800,            // how long the hover effect takes to fade in and out
  hoverIdleMs: 1500,           // the mouse or finger counts as present until it has been still this long (ms)
  selection: true,             // tap or click = pick the pixels of similar color (like a magic wand) and LOCK them as they look right now.
                               // The rest keeps looping. Every tap adds to the locked area. Tap a locked area to unlock it, Esc or "Clear selection" in the menu clears all
  flashMs: 250,                // while something is locked, the rest changes in a quick flash of this length (ms) instead of a slow dissolve (0 = keep the dissolve)
  selectionHoldMs: 8000,       // a locked area unlocks by itself after this many ms (0 = stays locked until you clear it)
  releaseMs: 1500,             // an unlocked area dissolves back into the loop over this time (0 = instant)
  clickToRelease: true,        // true = tapping a locked area unlocks only that area
  wandTolerance: 40,           // how different a color can be and still be picked (0-441; about 20 = strict, 80 = loose)
  wandContiguous: true,        // true = only pixels connected to the tap. false = similar colors anywhere in the image
  selectionRes: 640,           // resolution of the selection (long edge, px). Higher = finer edges but slower on phones

  /* Dragging the square (finger or mouse button): it moves a little with resistance and springs back like a rubber band */
  pull: {
    max: 0.01,        // furthest it can travel, as a fraction of the image width (0.01 = 1%; it was 0.05 = 5%)
    resist: 1.4,      // resistance: 1 = follows the finger 1:1 at first, higher = heavier and stiffer
    follow: 28,       // how tightly it follows the finger while pressed (higher = tighter)
    spring: 140,      // how strongly it pulls back after release (higher = faster return)
    damp: 10,         // bounce: lower = more wobble, 26 = no wobble at all
    twist: 0.6,       // degrees of tilt when you pull it away from its center (0 = none)
    press: 0.985,     // size while touched (1 = no change)
    effect: 1         // how strongly the pull and its speed drive the effects (0 = none, 1 = full)
  },
  /* Gestures (tap and click are the same thing) */
  gestures: {
    freeze: false,    // keep false: taps select areas. (true = a tap freezes the whole frame instead)
    tapMs: 250,       // a touch shorter than this, with no drag, is a tap
    tapSlop: 10,      // px: moving more than this makes it a drag, not a tap
    holdMs: 500,      // holding still this long freezes the frame exactly as pulled
    holdSlop: 6       // px: small finger tremor allowed while holding
  },
  focus: [0.5, 0.5]     // part of each image that stays in view when the window crops it (0-1, [0.5, 0.5] = center)
};

/* ===== RANDOMNESS ==================================================== */
/* A new random value is drawn for each parameter below at the start of every transition, so no two behave the same.
   The fixed values in CONFIG are just the starting point. All draws come from the seed, so they can be repeated.
   [min, max] = random number between the two   { pick: [...] } = one random choice   { pair: [min, max] } = a random low-high range
   To keep a parameter fixed, delete its line here. To stop all randomness: enabled: false. */
const RANDOM = {
  enabled: true,
  params: {
    transitionMs: [1500, 9000],
    holdMs: [0, 2500],
    order: { pick: ["sequence", "shuffle"] },
    style: { pick: ["blend", "crossfade"] },
    blendMode: { pick: ["multiply", "screen", "overlay", "soft-light", "hard-light", "difference", "color-dodge", "color-burn", "luminosity"] },
    blendAmount: [0.2, 1],
    ease: { pick: [true, false] },
    hoverAmount: { pair: [0.05, 1] },
    hoverEveryMs: [300, 2500],
    hoverGlide: [0.05, 0.2],
    hoverFloor: [0, 0.7],
    hoverFadeMs: [300, 2000],
    hoverIdleMs: [800, 3000],
    flashMs: [0, 600],
    wandTolerance: [15, 90],
    wandContiguous: { pick: [true, false] },
    selectionHoldMs: [3000, 20000],
    releaseMs: [300, 4000]
  }
};
const ROLL = {
  transition: ['transitionMs', 'holdMs', 'order', 'style', 'blendMode', 'blendAmount', 'ease', 'flashMs',
               'hoverAmount', 'hoverEveryMs', 'hoverGlide', 'hoverFloor', 'hoverFadeMs', 'hoverIdleMs'],
  click: ['wandTolerance', 'wandContiguous', 'selectionHoldMs'],
  release: ['releaseMs']
};
/* ===================================================================== */

/* Seeded random numbers: the same seed + transition number always gives the same draws */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash32 = (s, n) => (Math.imul(s ^ 0x9e3779b9, 0x85ebca6b) + Math.imul(n + 1, 0xc2b2ae35)) >>> 0;
let seed = CONFIG.seed != null ? CONFIG.seed >>> 0 : crypto.getRandomValues(new Uint32Array(1))[0];
let tn = 0, R = mulberry32(hash32(seed, 0));         // tn: transition counter; R: random source of the current transition
function roll(keys) {                                // draw new random values for these CONFIG parameters
  if (!RANDOM.enabled) return;
  keys.forEach(k => {
    const sp = RANDOM.params[k]; if (!sp) return;
    const num = (a, b) => { const v = a + R() * (b - a); return b > 10 ? Math.round(v) : v; };
    if (Array.isArray(sp)) CONFIG[k] = num(sp[0], sp[1]);
    else if (sp.pick) CONFIG[k] = sp.pick[Math.floor(R() * sp.pick.length)];
    else if (sp.pair) { const a = num(sp.pair[0], sp.pair[1]), b = num(sp.pair[0], sp.pair[1]); CONFIG[k] = [Math.min(a, b), Math.max(a, b)]; }
  });
}

/* Builds each portrait's image list: folder/001.jpg ... */
CONFIG.portraits.forEach(p => {
  if (p.images) return;
  p.images = Array.from({ length: p.count || 100 }, (_, i) => ({
    dir: CONFIG.imageBase + p.folder, file: `${String(i + 1).padStart(3, '0')}.jpg` }));
});

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let cur = 0, epoch = 0;                              // active portrait, switch counter
const imgs = () => CONFIG.portraits[cur].images;
const count = () => imgs().length || 6;
let W, H, C;
let curMode = CONFIG.blendMode, curMs = CONFIG.transitionMs;           // mode and duration of the current transition
const live = { amount: CONFIG.blendAmount, target: CONFIG.blendAmount };  // blend strength: moves smoothly toward its target
const mouse = { last: -1e9, roll: 0 };                                  // when the mouse or finger was last moving on the image
let energy = 0, effE = 0, lastQ = 0, lastNow = performance.now();      // energy: hover presence 0-1; effE: energy + pull effect; lastQ: loop position 0 (A) to 1 (B)
let imgA, imgB, A, B, idxA = -1, idxB = -1, phase = 'loading', t0 = 0, prog = 0, queue = [];
const cache = new Map();
const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
const held = document.createElement('canvas'), hctx = held.getContext('2d');           // locked areas: pixels picked by tapping
const fadeC = document.createElement('canvas'), fctx = fadeC.getContext('2d');         // pixels that are fading out of the lock
let heldHas = false, selBlocked = false, heldAt = 0, fadeAt = 0;

/* The canvas always takes the proportions of the image and fits inside the window with a margin */
let aspect = 3 / 4;
function setBox() {
  cv.style.aspectRatio = aspect;
  cv.style.width = `min(calc(100vw - 2 * var(--m)), calc((100dvh - 2 * var(--m)) * ${aspect}))`;
}
function applyAspect(im) {
  const a = (im.naturalWidth || im.width) / (im.naturalHeight || im.height);
  if (Math.abs(a - aspect) < .005) return false;
  aspect = a; setBox(); return true;
}

/* Caption */
const capTitle = document.getElementById('capTitle'), nA = document.getElementById('nA'), nB = document.getElementById('nB');
if (!CONFIG.caption) document.querySelector('.caption').style.display = 'none';
capTitle.textContent = CONFIG.portraits[0].title; capTitle.style.transition = 'opacity .5s ease';
const label = i => '(#' + String(i + 1).padStart(3, '0') + ')';
const setCaption = p => { nA.style.opacity = 1 - p; nB.style.opacity = p; };
const showCaption = i => { nA.textContent = label(i); nB.textContent = ''; setCaption(0); };


/* ===== Rubber-band square ===== */
const pull = { x: 0, y: 0, vx: 0, vy: 0, r: 0, s: 1, fx: 0, mx: 10, my: 10 };   // position (px), speed, tilt, scale, effect level, travel limits
const gest = { down: false, moved: false, holdFired: false, sx: 0, sy: 0, dx: 0, dy: 0, ax: 0, ay: 0, gx: 0, gy: 0, st: 0, timer: 0 };
function updateLimits() {                            // the square may never leave the screen
  const cw = cv.clientWidth, ch = cv.clientHeight;
  pull.mx = Math.max(1, Math.min(CONFIG.pull.max * cw, (innerWidth - cw) / 2 - 2));
  pull.my = Math.max(1, Math.min(CONFIG.pull.max * cw, (innerHeight - ch) / 2 - 2));
}
const soft = (d, m) => m * Math.tanh(d / (m * CONFIG.pull.resist));   // 1:1 near zero, harder the further you pull
function stepPull(ds) {
  if (frozen && !settling) return;                   // a frozen pull stays exactly where it is
  const P = CONFIG.pull;
  if (gest.down && gest.moved) {                     // follow the finger, with resistance
    const k = 1 - Math.exp(-P.follow * ds), nx = pull.x + (soft(gest.dx, pull.mx) - pull.x) * k, ny = pull.y + (soft(gest.dy, pull.my) - pull.y) * k;
    pull.vx = (nx - pull.x) / Math.max(ds, 1e-3); pull.vy = (ny - pull.y) / Math.max(ds, 1e-3); pull.x = nx; pull.y = ny;
  } else {                                           // spring back, keeping the momentum of the release
    pull.vx += (-P.spring * pull.x - P.damp * pull.vx) * ds; pull.vy += (-P.spring * pull.y - P.damp * pull.vy) * ds;
    pull.x += pull.vx * ds; pull.y += pull.vy * ds;
  }
  pull.r = P.twist * (gest.gx * (pull.y / pull.my) - gest.gy * (pull.x / pull.mx));   // pulling away from the center tilts it
  pull.s += ((gest.down ? P.press : 1) - pull.s) * (1 - Math.exp(-14 * ds));
  applyPull();
}
const applyPull = () => { cv.style.transform = `translate3d(${pull.x}px, ${pull.y}px, 0) rotate(${pull.r}deg) scale(${pull.s})`; };
const atRest = () => Math.abs(pull.x) < .25 && Math.abs(pull.y) < .25 && Math.abs(pull.vx) < 3 && Math.abs(pull.vy) < 3 && Math.abs(pull.s - 1) < .003 && pull.fx < .02;

function size() {
  let snapC = null;                                  // keep the locked areas when the window changes size
  if (heldHas) { snapC = document.createElement('canvas'); snapC.width = held.width; snapC.height = held.height; snapC.getContext('2d').drawImage(held, 0, 0); }
  const cw = cv.clientWidth, ch = cv.clientHeight;
  const d = Math.min(window.devicePixelRatio || 1, Math.sqrt(12e6 / (cw * ch)));   // native resolution, capped for safety
  W = cv.width = Math.round(cw * d);
  H = cv.height = Math.round(ch * d);
  if (CONFIG.selection) { layer.width = W; layer.height = H; }
  held.width = W; held.height = H; fadeC.width = W; fadeC.height = H;
  if (snapC) hctx.drawImage(snapC, 0, 0, W, H);
  updateLimits();
}

function fit(img) {  // draw an image to fill the canvas (cover)
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = Math.max(W / iw, H / ih), w = iw * s, h = ih * s;
  c.getContext('2d').drawImage(img, (W - w) * CONFIG.focus[0], (H - h) * CONFIG.focus[1], w, h);
  return c;
}

function demo() {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960;
  const x = c.getContext('2d'), r = (a, b) => a + Math.random() * (b - a);
  const g = x.createLinearGradient(0, 0, r(0, 540), 960);
  for (let k = 0; k < 3; k++) g.addColorStop(k / 2, `hsl(${r(0,360)|0},${r(40,90)|0}%,${r(15,65)|0}%)`);
  x.fillStyle = g; x.fillRect(0, 0, 540, 960);
  for (let k = 0; k < 6; k++) { x.fillStyle = `hsla(${r(0,360)|0},70%,55%,.5)`;
    x.beginPath(); x.arc(r(0,540), r(0,960), r(40,200), 0, 7); x.fill(); }
  return c;
}

const sizesAsc = [...CONFIG.sizes].sort((x, y) => x - y);
function pickSizes() {
  if (!sizesAsc.length) return [null];
  let need = Math.max(W || 0, H || 0);
  if (navigator.connection && navigator.connection.saveData) need *= .6;
  let k = sizesAsc.findIndex(s => s >= need * .8);
  if (k < 0) k = sizesAsc.length - 1;
  return [...sizesAsc.slice(k), ...sizesAsc.slice(0, k).reverse()];
}
const srcFor = (item, size) => item.src || (size ? `${item.dir}/${size}/${item.file}` : `${item.dir}/${item.file}`);
function loadFirst(item, tries) {
  return new Promise(resolve => {
    let n = 0;
    const next = () => {
      if (n >= tries.length) return resolve(demo());
      const im = new Image(); if (CONFIG.imageCors) im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im); im.onerror = next; im.src = srcFor(item, tries[n++]);
    };
    next();
  });
}
function getImage(i) {
  const tries = pickSizes(), key = i + '@' + tries[0];
  if (cache.has(key)) return cache.get(key);
  const list = imgs();
  const p = list.length ? loadFirst(list[i], tries) : Promise.resolve(demo());
  cache.set(key, p);
  if (cache.size > 4) cache.delete(cache.keys().next().value);
  return p;
}

function nextIndex() {
  const n = count();
  if (CONFIG.order === 'shuffle') {
    if (!queue.length) { queue = [...Array(n).keys()].sort(() => R() - .5);
      if (n > 1 && queue[queue.length - 1] === idxB) queue.reverse(); }
    return queue.pop();
  }
  return (idxB + 1) % n;
}

/* C = image A with image B laid over it using the blend mode, mixed in during the transition */
function makeBlend() {
  if (CONFIG.style !== 'blend') return;
  C = document.createElement('canvas'); C.width = W; C.height = H;
  const c = C.getContext('2d');
  c.drawImage(A, 0, 0);
  c.globalCompositeOperation = curMode; c.drawImage(B, 0, 0);
}

function draw(p) {  // p: 0 = image A, 1 = image B
  lastQ = p;
  if (!A) return;
  drawBase(p);
  if (heldHas) ctx.drawImage(held, 0, 0);            // locked areas stay on top, whatever the loop shows
  if (fadeAt) {                                      // areas that were just unlocked fade out
    const a = 1 - (performance.now() - fadeAt) / CONFIG.releaseMs;
    if (a <= 0) { fadeAt = 0; fctx.clearRect(0, 0, W, H); }
    else { ctx.globalAlpha = a; ctx.drawImage(fadeC, 0, 0); ctx.globalAlpha = 1; }
  }
}
function drawBase(p) {
  setCaption(p);
  ctx.drawImage(A, 0, 0);
  if (p <= 0) return;
  if (p >= 1) { ctx.drawImage(B, 0, 0); return; }
  if (CONFIG.style === 'blend' && C) {
    ctx.globalAlpha = p; ctx.drawImage(B, 0, 0);
    const base = CONFIG.blendAmount, amt = base + (live.amount - base) * effE;      // random strength, driven by hover and pull
    const floor = CONFIG.hoverFloor * effE, edge = Math.min(1, p / .08, (1 - p) / .08);
    ctx.globalAlpha = Math.min(1, amt * (floor + (1 - floor) * Math.sin(Math.PI * p)) * edge); ctx.drawImage(C, 0, 0);
    ctx.globalAlpha = 1; return;
  }
  ctx.globalAlpha = p; ctx.drawImage(B, 0, 0); ctx.globalAlpha = 1;
}

const flash = t => { const w = Math.min(.5, CONFIG.flashMs / curMs); return t < 1 - w ? 0 : (t - (1 - w)) / w; };   // hold, then a quick change at the end
function clearHeld() { hctx.clearRect(0, 0, held.width, held.height); heldHas = false; }
function releaseHeld() {                            // unlock everything, with a fade
  if (!heldHas) return;
  roll(ROLL.release);
  if (CONFIG.releaseMs > 0) { fctx.drawImage(held, 0, 0); fadeAt = performance.now(); }
  clearHeld();
}
function releaseAt(clientX, clientY) {              // unlock only the locked area under the click
  const r = cv.getBoundingClientRect(), k = CONFIG.selectionRes / Math.max(W, H);
  const w = Math.max(1, Math.round(W * k)), h = Math.max(1, Math.round(H * k));
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const tc = t.getContext('2d', { willReadFrequently: true }); tc.drawImage(held, 0, 0, w, h);
  const px = tc.getImageData(0, 0, w, h).data;
  const x0 = Math.min(w - 1, Math.max(0, Math.floor((clientX - r.left) / r.width * w)));
  const y0 = Math.min(h - 1, Math.max(0, Math.floor((clientY - r.top) / r.height * h)));
  const on = i => px[i * 4 + 3] > 40;
  if (!on(y0 * w + x0)) return false;               // click was not on a locked area
  const m = new Uint8Array(w * h), stack = [y0 * w + x0]; m[y0 * w + x0] = 1;
  while (stack.length) {
    const i = stack.pop(), x = i % w, y = (i - x) / w;
    if (x > 0 && !m[i - 1] && on(i - 1)) { m[i - 1] = 1; stack.push(i - 1); }
    if (x < w - 1 && !m[i + 1] && on(i + 1)) { m[i + 1] = 1; stack.push(i + 1); }
    if (y > 0 && !m[i - w] && on(i - w)) { m[i - w] = 1; stack.push(i - w); }
    if (y < h - 1 && !m[i + w] && on(i + w)) { m[i + w] = 1; stack.push(i + w); }
  }
  const mc = document.createElement('canvas'); mc.width = w; mc.height = h;
  const mx = mc.getContext('2d'), id = mx.createImageData(w, h);
  for (let i = 0; i < w * h; i++) { id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = 255; id.data[i * 4 + 3] = m[i] ? 255 : 0; }
  mx.putImageData(id, 0, 0);
  lctx.globalCompositeOperation = 'source-over'; lctx.clearRect(0, 0, W, H); lctx.drawImage(held, 0, 0);
  lctx.globalCompositeOperation = 'destination-in'; lctx.imageSmoothingEnabled = true; lctx.drawImage(mc, 0, 0, W, H);
  roll(ROLL.release);
  if (CONFIG.releaseMs > 0) { fctx.drawImage(layer, 0, 0); fadeAt = performance.now(); }
  hctx.globalCompositeOperation = 'destination-out'; hctx.drawImage(mc, 0, 0, W, H); hctx.globalCompositeOperation = 'source-over';
  heldHas = false;                                  // still locked if any other locked pixel remains
  for (let i = 3; i < px.length; i += 4) if (px[i] > 40 && !m[(i - 3) / 4]) { heldHas = true; break; }
  return true;
}
/* Magic wand: picks the pixels whose color is close to the clicked pixel and locks them as they look now */
function wand(clientX, clientY) {
  const src = lastQ < .5 ? A : B;                    // the image that is mostly on screen
  if (!src) return;
  const r = cv.getBoundingClientRect(), k = CONFIG.selectionRes / Math.max(W, H);
  const w = Math.max(1, Math.round(W * k)), h = Math.max(1, Math.round(H * k));
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const tc = t.getContext('2d', { willReadFrequently: true }); tc.imageSmoothingQuality = 'high'; tc.drawImage(src, 0, 0, w, h);
  let px; try { px = tc.getImageData(0, 0, w, h).data; } catch (err) { selBlocked = true; return; }   // blocked: image from another site without permission
  const x0 = Math.min(w - 1, Math.max(0, Math.floor((clientX - r.left) / r.width * w)));
  const y0 = Math.min(h - 1, Math.max(0, Math.floor((clientY - r.top) / r.height * h)));
  let sr = 0, sg = 0, sb = 0, n = 0;                 // seed color = average of the 3x3 pixels around the click
  for (let y = Math.max(0, y0 - 1); y <= Math.min(h - 1, y0 + 1); y++) for (let x = Math.max(0, x0 - 1); x <= Math.min(w - 1, x0 + 1); x++) {
    const i = (y * w + x) * 4; sr += px[i]; sg += px[i + 1]; sb += px[i + 2]; n++;
  }
  sr /= n; sg /= n; sb /= n;
  const tol2 = CONFIG.wandTolerance * CONFIG.wandTolerance, m = new Uint8Array(w * h);
  const close = i => { const dr = px[i * 4] - sr, dg = px[i * 4 + 1] - sg, db = px[i * 4 + 2] - sb; return dr * dr + dg * dg + db * db <= tol2; };
  if (CONFIG.wandContiguous) {                       // flood fill outward from the click
    const stack = [y0 * w + x0]; m[y0 * w + x0] = 1;
    while (stack.length) {
      const i = stack.pop(), x = i % w, y = (i - x) / w;
      if (x > 0 && !m[i - 1] && close(i - 1)) { m[i - 1] = 1; stack.push(i - 1); }
      if (x < w - 1 && !m[i + 1] && close(i + 1)) { m[i + 1] = 1; stack.push(i + 1); }
      if (y > 0 && !m[i - w] && close(i - w)) { m[i - w] = 1; stack.push(i - w); }
      if (y < h - 1 && !m[i + w] && close(i + w)) { m[i + w] = 1; stack.push(i + w); }
    }
  } else for (let i = 0; i < w * h; i++) if (close(i)) m[i] = 1;
  const mc = document.createElement('canvas'); mc.width = w; mc.height = h;
  const mx = mc.getContext('2d'), id = mx.createImageData(w, h);
  for (let i = 0; i < w * h; i++) { id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = 255; id.data[i * 4 + 3] = m[i] ? 255 : 0; }
  mx.putImageData(id, 0, 0);
  lctx.globalCompositeOperation = 'source-over'; lctx.clearRect(0, 0, W, H); lctx.drawImage(src, 0, 0);
  lctx.globalCompositeOperation = 'destination-in'; lctx.imageSmoothingEnabled = true; lctx.imageSmoothingQuality = 'high';
  lctx.drawImage(mc, 0, 0, W, H);                    // scaling the mask up softens the edge
  hctx.drawImage(layer, 0, 0); heldHas = true; heldAt = performance.now();       // lock: these pixels now stay as they are
}

async function advance() {
  const e = epoch;
  idxB = nextIndex();
  const im = await getImage(idxB);
  if (e !== epoch) return;                          // portrait changed while loading
  if (frozen) { idxB = idxA; phase = 'hold'; t0 = performance.now(); return; }
  imgB = im;
  if (applyAspect(im)) {                            // different proportions: show it directly, no dissolve
    clearHeld(); size(); B = fit(imgB); A = B; imgA = imgB; ctx.drawImage(A, 0, 0);
    idxA = idxB; lastQ = 0; showCaption(idxA); phase = 'hold'; t0 = performance.now(); return;
  }
  tn++; R = mulberry32(hash32(seed, tn)); roll(ROLL.transition);       // new random look for this transition
  const hovering = CONFIG.hover && performance.now() - mouse.last < CONFIG.hoverIdleMs;
  curMode = hovering ? CONFIG.hoverModes[Math.floor(R() * CONFIG.hoverModes.length)] : CONFIG.blendMode;
  curMs = CONFIG.transitionMs;
  prog = 0;
  B = fit(imgB); makeBlend();
  nA.textContent = label(idxA); nB.textContent = label(idxB);
  phase = 'dissolve'; t0 = performance.now();
  if (CONFIG.order !== 'shuffle') getImage((idxB + 1) % count());  // preload the next one
}

/* ===== Freeze, save, replay ===== */
let frozen = false, settling = false, replay = false, snap = null, exportPending = false;
const r4 = v => Math.round(v * 1e4) / 1e4;
const enc = o => btoa(JSON.stringify(o)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const dec = s => JSON.parse(atob(s.replace(/-/g, '+').replace(/_/g, '/')));
function makeSnap() {                                // everything needed to redraw this exact frame
  return { v: 1, seed, n: tn, portrait: cur, a: idxA, b: lastQ > 0 ? idxB : idxA, p: r4(lastQ), mode: curMode, style: CONFIG.style,
    amt: r4(CONFIG.blendAmount), live: r4(live.amount), floor: r4(CONFIG.hoverFloor), e: r4(effE), asp: r4(aspect), focus: CONFIG.focus,
    pull: { x: r4(pull.x / pull.mx), y: r4(pull.y / pull.my), r: r4(pull.r), s: r4(pull.s) } };
}
function freeze(keepPull) {
  if (frozen) return;
  frozen = true;
  if (keepPull) { settling = false; finalize(); }    // frozen exactly as pulled
  else { settling = !atRest(); if (!settling) finalize(); }   // otherwise wait until the square is back in place
}
function finalize() {
  settling = false; snap = makeSnap();
  try { history.replaceState(null, '', '#p=' + enc(snap)); } catch (e) {}
  if (exportPending) { exportPending = false; exportPiece(); }
}
function unfreeze() {
  if (!frozen) return;
  frozen = false; settling = false; snap = null; exportPending = false; lastNow = performance.now();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (replay) {                                      // a piece loaded from a link: finish its transition and carry on
    replay = false; A = B; imgA = imgB; idxA = idxB; lastQ = 0; prog = 0; ctx.drawImage(A, 0, 0); showCaption(idxA);
    phase = 'hold'; t0 = performance.now();
  }
}
/* Share / Save: first working version, to be developed further */
const pieceLink = () => location.origin + location.pathname + '#p=' + enc(frozen && snap ? snap : makeSnap());   // opens this frame (without locked areas)
async function exportPiece() {                       // saves the image exactly as it is on screen now
  try {
    cv.toBlob(async blob => {
      if (!blob) return;
      const name = `piece-${seed.toString(16)}-${tn}.png`, file = new File([blob], name, { type: 'image/png' });
      try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: CONFIG.portraits[cur].title }); return; } }
      catch (err) { if (err && err.name === 'AbortError') return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  } catch (e) {}
}
function shareOnX() {                                // opens X with the title and a link to this frame
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(CONFIG.portraits[cur].title) + '&url=' + encodeURIComponent(pieceLink()), '_blank', 'noopener');
}
window.savePiece = exportPiece;
async function loadPiece(s) {                        // redraw a saved piece exactly
  seed = s.seed; tn = s.n; cur = Math.min(s.portrait, CONFIG.portraits.length - 1);
  aspect = s.asp; setBox(); CONFIG.focus = s.focus; size();
  idxA = s.a; idxB = s.b; imgA = await getImage(idxA); imgB = idxB === idxA ? imgA : await getImage(idxB);
  A = fit(imgA); B = fit(imgB);
  curMode = s.mode; CONFIG.style = s.style; CONFIG.blendAmount = s.amt; CONFIG.hoverFloor = s.floor; live.amount = s.live; effE = s.e;
  makeBlend(); draw(s.p); showCaption(idxA);
  pull.x = s.pull.x * pull.mx; pull.y = s.pull.y * pull.my; pull.r = s.pull.r; pull.s = s.pull.s; applyPull();
  frozen = true; settling = false; replay = true; snap = s; phase = 'hold'; t0 = performance.now();
}

function frame(now) {
  const dt = Math.min(now - lastNow, 50); lastNow = now; const ds = dt / 1000;
  if (heldHas && CONFIG.selectionHoldMs && performance.now() - heldAt > CONFIG.selectionHoldMs) releaseHeld();
  if (!frozen || settling) {
    stepPull(ds);
    if (CONFIG.hover) {
      const present = now - mouse.last < CONFIG.hoverIdleMs;
      energy += ((present ? 1 : 0) - energy) * Math.min(1, dt / CONFIG.hoverFadeMs * 3);   // fades in and out, never jumps
      if (present && now - mouse.roll > CONFIG.hoverEveryMs) {
        mouse.roll = now;
        live.target = CONFIG.hoverAmount[0] + R() * (CONFIG.hoverAmount[1] - CONFIG.hoverAmount[0]);
      }
      live.amount += (live.target - live.amount) * CONFIG.hoverGlide;
    }
    const speed = Math.hypot(pull.vx, pull.vy), disp = Math.min(1.4, Math.hypot(pull.x / pull.mx, pull.y / pull.my));
    pull.fx += (Math.min(1, disp * .9 + Math.min(1, speed / 500) * .6) - pull.fx) * (1 - Math.exp(-12 * ds));   // the pull and its speed drive the effects
    effE = Math.min(1, energy + pull.fx * CONFIG.pull.effect);
  }
  if (frozen) {
    if (settling) { draw(lastQ); if (atRest()) { pull.x = pull.y = pull.vx = pull.vy = 0; pull.r = 0; pull.s = 1; applyPull(); finalize(); } }
    requestAnimationFrame(frame); return;
  }
  if (phase === 'dissolve') {
    prog += dt / curMs;
    if (prog >= 1) { draw(1); imgA = imgB; A = B; idxA = idxB; lastQ = 0; showCaption(idxA); prog = 0; phase = 'hold'; t0 = now; }
    else draw(heldHas && CONFIG.flashMs ? flash(prog) : CONFIG.ease ? prog * prog * (3 - 2 * prog) : prog);
  } else if (phase === 'hold' && now - t0 >= CONFIG.holdMs) { phase = 'loading'; advance(); }
  if (fadeAt && phase !== 'dissolve') draw(lastQ);  // keep the unlock fade moving during a pause
  requestAnimationFrame(frame);
}

async function start() {
  setBox(); size();
  let piece = null; try { if (location.hash.startsWith('#p=')) piece = dec(location.hash.slice(3)); } catch (e) {}
  if (piece) { try { await loadPiece(piece); requestAnimationFrame(frame); return; } catch (e) { frozen = false; replay = false; } }
  idxB = -1; idxA = nextIndex(); idxB = idxA;
  imgA = await getImage(idxA); applyAspect(imgA); size(); A = fit(imgA); ctx.drawImage(A, 0, 0); showCaption(idxA);
  phase = 'hold'; t0 = performance.now();
  requestAnimationFrame(frame);
}

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  if (!imgA) return; size(); A = fit(imgA); B = imgB && (phase === 'dissolve' || replay) ? fit(imgB) : B;
  if (phase === 'dissolve' || replay) makeBlend();
  draw(lastQ); }, 60); });

/* ===== Touch and mouse: drag = rubber band, tap = freeze / unfreeze, hold = freeze as pulled, double tap = save ===== */
const G = () => CONFIG.gestures;
function armHold() { if (!G().freeze) return; clearTimeout(gest.timer); gest.timer = setTimeout(() => { if (gest.down && !frozen) { gest.holdFired = true; freeze(true); } }, G().holdMs); }
cv.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const r = cv.getBoundingClientRect();
  gest.gx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2); gest.gy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);   // where you grabbed it
  Object.assign(gest, { down: true, moved: false, holdFired: false, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0, ax: e.clientX, ay: e.clientY, st: performance.now() });
  if (CONFIG.hover) mouse.last = performance.now();
  cv.style.cursor = 'grabbing'; armHold();
});
cv.addEventListener('pointermove', e => {
  if (CONFIG.hover) mouse.last = performance.now();
  if (!gest.down) return;
  gest.dx = e.clientX - gest.sx; gest.dy = e.clientY - gest.sy;
  if (!gest.moved && Math.hypot(gest.dx, gest.dy) > G().tapSlop) gest.moved = true;
  if (Math.hypot(e.clientX - gest.ax, e.clientY - gest.ay) > G().holdSlop) { gest.ax = e.clientX; gest.ay = e.clientY; armHold(); }   // still moving: restart the hold timer
});
function endPress(e, cancelled) {
  if (!gest.down) return;
  clearTimeout(gest.timer); gest.down = false; cv.style.cursor = 'grab';
  if (!cancelled && !gest.moved && !gest.holdFired && performance.now() - gest.st < G().tapMs) onTap(e);
}
cv.addEventListener('pointerup', e => endPress(e, false));
cv.addEventListener('pointercancel', e => endPress(e, true));
cv.addEventListener('pointerleave', () => { if (!gest.down) mouse.last = -1e9; });
cv.addEventListener('contextmenu', e => e.preventDefault());
function onTap(e) {
  if (frozen) return unfreeze();                     // a piece opened from a link: a tap continues
  if (G().freeze) return freeze(false);
  if (!CONFIG.selection) return;
  roll(ROLL.click);
  if (CONFIG.clickToRelease && heldHas && releaseAt(e.clientX, e.clientY)) return;   // tapped a locked area: unlock it
  if (!selBlocked) wand(e.clientX, e.clientY);
}

/* The page never scrolls, zooms or pulls to refresh (menu list excepted) */
document.addEventListener('touchmove', e => { if (!e.target.closest('nav')) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
let lastEnd = 0;                                   // two quick touches never zoom the page
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastEnd < 350 && !e.target.closest('nav, .menu-btn, .share')) e.preventDefault(); lastEnd = n; }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());

/* Switching portrait: the new portrait dissolves in from whatever is on screen */
function selectPortrait(k) {
  if (k === cur) return;
  if (frozen) unfreeze();
  cur = k; epoch++; cache.clear(); queue = []; idxB = -1; clearHeld();
  if (A) { const s = document.createElement('canvas'); s.width = W; s.height = H;
    s.getContext('2d').drawImage(cv, 0, 0); A = s; imgA = s; }
  capTitle.style.opacity = 0;
  setTimeout(() => { capTitle.textContent = CONFIG.portraits[k].title; capTitle.style.opacity = 1; }, 500);
  phase = 'loading'; advance();
}

start();

const btn = document.getElementById('btn'), menu = document.getElementById('menu');
const setOpen = o => { menu.classList.toggle('open', o); btn.setAttribute('aria-expanded', o); if (!o) setDrop(false); };
const pBtn = document.getElementById('portraitsBtn'), pList = document.getElementById('portraitList');
const setDrop = o => { pList.classList.toggle('open', o); pBtn.setAttribute('aria-expanded', o); pBtn.lastElementChild.textContent = o ? '\u2212' : '+'; };
pBtn.addEventListener('click', () => setDrop(!pList.classList.contains('open')));
CONFIG.portraits.forEach((p, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.textContent = p.title; b.setAttribute('aria-current', i === cur);
  b.addEventListener('click', () => {
    selectPortrait(i);
    pList.querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-current', j === i));
    setOpen(false);
  });
  li.appendChild(b); pList.appendChild(li);
});
btn.addEventListener('click', () => setOpen(!menu.classList.contains('open')));
const shareBtn = document.getElementById('shareBtn'), shareList = document.getElementById('shareList');
const setShare = o => { shareList.hidden = !o; shareBtn.setAttribute('aria-expanded', o); };
shareBtn.addEventListener('click', () => setShare(shareList.hidden));
document.getElementById('shareSave').addEventListener('click', () => { exportPiece(); setShare(false); });
document.getElementById('shareX').addEventListener('click', () => { shareOnX(); setShare(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { setOpen(false); unfreeze(); releaseHeld(); } });
menu.addEventListener('click', e => { if (e.target.tagName === 'A') setOpen(false); });
document.getElementById('clearSel').addEventListener('click', () => { releaseHeld(); setOpen(false); });
</script>
</body>
